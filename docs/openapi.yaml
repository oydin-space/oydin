      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Import' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Загрузить файл (≤ 10 МБ) → разбор + AI-маппинг колонок → превью. Ничего не сохраняется в операции
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                kind: { $ref: '#/components/schemas/ImportKind', description: Если не задан — автоопределение }
                account_id: { type: integer, description: Счёт по умолчанию для строк }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Import' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /imports/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Import' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Поправить маппинг → пересчитанное превью
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { mapping: { $ref: '#/components/schemas/ColumnMapping' }, account_id: { type: integer } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Import' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /imports/{id}/commit/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Сохранить строки как confirmed операции (source=import); дубликаты пропускаются, если skip_duplicates
      requestBody:
        content: { application/json: { schema: { type: object, properties: { skip_duplicates: { type: boolean, default: true }, exclude_rows: { type: array, items: { type: integer } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Import' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /exports/transactions/:
    get:
      summary: Выгрузка операций (exports.read)
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, 1c_bank] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Файл (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
            text/plain: { schema: { type: string, description: 1CClientBankExchange, windows-1251 } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /ocr/:
    post:
      summary: Фото чека или текст банковского SMS → черновики операций (не сохраняются)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: 'jpeg/png/webp/heic, ≤ 5 МБ' }
                text: { type: string, maxLength: 4000, description: Текст SMS; нужно image или text }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OcrResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  # ───────────── telegram & notifications ─────────────
  /telegram/webhook/:
    post:
      security: [{ telegramSecret: [] }]
      summary: Telegram Bot API update. Секрет сравнивается с TELEGRAM_WEBHOOK_SECRET (constant-time). Текст/голос/фото/пересланные SMS → черновик с inline-кнопкой подтверждения
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [update_id], additionalProperties: true, properties: { update_id: { type: integer } } } } }
      responses:
        '200': { description: 'Принято (всегда 200 после проверки секрета, чтобы Telegram не ретраил)', content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /notifications/settings/:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /notifications/test/:
    post:
      summary: Отправить пробный бриф/CFO call в Telegram сейчас
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [daily_brief, weekly_cfo_call] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '409': { $ref: '#/components/responses/Error', description: Telegram не привязан }
        '502': { $ref: '#/components/responses/Error' }
  # ───────────── OpenUI saved tools ─────────────
  /tools/:
    get:
      parameters: [{ name: pinned, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SavedTool' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Закрепить сгенерированный калькулятор/планировщик (ui валидируется парсером OpenUI Lang)
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SavedToolInput' }, { required: [title, ui] }] } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /tools/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavedToolInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  # ───────────── personal tokens & webhooks (session, owner) ─────────────
  /developer/tokens/:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ApiToken' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 }, scopes: { type: array, items: { type: string, enum: [read, write] }, default: [read] } } } } }
      responses:
        '201':
          description: Токен показывается один раз
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiToken' }, { type: object, required: [token], properties: { token: { type: string } } }] } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /developer/tokens/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      responses:
        '204': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /developer/webhooks/:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WebhookSubscription' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [url, events], properties: { url: { type: string, format: uri }, events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WebhookEvent' } } } } } }
      responses:
        '201':
          description: Секрет подписи показывается один раз
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/WebhookSubscription' }, { type: object, required: [secret], properties: { secret: { type: string } } }] } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /developer/webhooks/{id}/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { active: { type: boolean }, events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WebhookEvent' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscription' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /developer/webhooks/{id}/ping/:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Отправить тестовую подписанную доставку
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: [integer, 'null'], description: HTTP-статус получателя } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  # ───────────── public API v1 (Bearer) ─────────────
  /v1/business/:
    get:
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Business' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/accounts/:
    get:
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Account' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/transactions/:
    get:
      security: [{ bearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items, next_cursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }, next_cursor: { type: [string, 'null'] } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearer: [] }]
      summary: Создать операцию (scope write, source=api). Idempotency-Key заголовок — защита от дублей 24ч
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string, maxLength: 80 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionInput' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/pulse/:
    get:
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pulse' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/forecast/:
    get:
      security: [{ bearer: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, default: 30, maximum: 90 } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [points], properties: { points: { type: array, items: { $ref: '#/components/schemas/ForecastPoint' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
webhooks:
  transaction.created:
    post:
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookPayload' } } }
      responses: { '200': { description: Любой 2xx — доставлено } }
  gap.detected:
    post:
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookPayload' } } }
      responses: { '200': { description: Любой 2xx — доставлено } }
