      description: 'Подпись принимается в течение 10 минут; hash одноразовый (повтор → 403 `invalid_hash`); 400 `expired` также для auth_date из будущего; 403 `forbidden` для staff; 503 `telegram_not_configured`'
      summary: Вход через Telegram Login Widget
      security: []
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, auth_date, hash]
              properties:
                id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
                photo_url: { type: string }
                auth_date: { type: integer, description: Unix time }
                hash: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  # ---------- Connectors (Oydin для разработчиков) ----------
  /connectors/:
    get:
      summary: Коннекторы бизнеса (MCP/REST); секрет не отдаётся, только has_secret
      x-roles: [owner]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connector' } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Создать коннектор. https-URL проходит SSRF-защиту (400 only_https, private_address, unresolvable_host, invalid_url, invalid_method, invalid_params_schema, invalid_kind; 409 connectors_limit)
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInput' } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /connectors/{id}/:
    get:
      summary: Коннектор
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Изменить (auth_secret "" снимает секрет; kind не меняется)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить коннектор
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /connectors/{id}/test/:
    post:
      summary: Проверить. MCP — подключиться и обновить список инструментов; REST — вызвать обработчик с args. Сбой сети отдаётся как ok=false, не как 5xx
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { args: { type: object, additionalProperties: true } } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  result: { type: [object, 'null'], description: 'REST: {status, body}', additionalProperties: true }
                  connector: { $ref: '#/components/schemas/Connector' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /billing/plans/:
    get:
      summary: Тарифы (публично, без входа). Только активные, по order; кэш 5 минут
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [ru, uz, en] } }
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=300' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        tagline: { type: string }
                        cta_note: { type: string }
                        icon: { type: string, description: имя иконки lucide }
                        price_uzs: { type: integer, description: '0 = бесплатно' }
                        period: { type: string, example: month }
                        popular: { type: boolean }
                        image: { type: string, example: /pricing/pro.webp }
                        features: { type: array, items: { type: string } }
                        new_features: { type: array, items: { type: string } }
                        missing: { type: array, items: { type: string } }
                        limits: { type: array, items: { type: string } }
  /billing/subscription/:
    get:
      summary: Подписка текущего бизнеса
      x-roles: [owner, accountant, seller]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: string }
                  status: { type: string, enum: [free, pending, active] }
                  renews_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Error' }
  /billing/checkout/:
    post:
      summary: Начать оплату тарифа через Click. Без PAYMENTS_ENABLED/ключей Click — {available:false}
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [plan], properties: { plan: { type: string } } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  url: { type: string, description: 'https://my.click.uz/services/pay?… (только при available=true)' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /billing/click/prepare/:
    post:
      summary: Click SHOP API, шаг Prepare (action=0). Form-encoded, подпись md5 sign_string. Ответ — всегда 200 с кодом Click (0, -1 подпись, -2 сумма, -4 оплачен, -5 заказ не найден, -9 отменён)
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { click_trans_id: { type: string }, service_id: { type: string }, click_paydoc_id: { type: string }, merchant_trans_id: { type: string }, amount: { type: string }, action: { type: string }, error: { type: string }, error_note: { type: string }, sign_time: { type: string }, sign_string: { type: string } } }
      responses:
        '200':
          description: '{click_trans_id, merchant_trans_id, merchant_prepare_id, error, error_note}'
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /billing/click/complete/:
    post:
      summary: Click SHOP API, шаг Complete (action=1), идемпотентно (повтор → -4)
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { click_trans_id: { type: string }, service_id: { type: string }, merchant_trans_id: { type: string }, merchant_prepare_id: { type: string }, amount: { type: string }, action: { type: string }, error: { type: string }, sign_time: { type: string }, sign_string: { type: string } } }
      responses:
        '200':
          description: '{click_trans_id, merchant_trans_id, merchant_confirm_id, error, error_note}'
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /onboarding/state/:
    get:
      summary: Состояние обязательного онбординга (один раз для каждого пользователя). done=false → клиент ведёт на /onboarding
      responses:
        '200':
          description: OnboardingState
          content:
            application/json:
              schema:
                type: object
                required: [done, step]
                properties:
                  done: { type: boolean }
                  step: { type: string, nullable: true, enum: [consent, name, contact, business, activity, pains, goals, upload, invite, install, tour, summary] }
                  steps: { type: object, additionalProperties: { type: string, enum: [pending, done, skipped, n/a] } }
                  progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
                  role: { type: string, nullable: true, enum: [owner, accountant, seller] }
                  ai_consent: { type: boolean }
                  prefill: { type: object, additionalProperties: true, description: '{first_name,last_name,email,phone,telegram,channel,language,brief_time,business{id,name,segment}|null}' }
                  answers: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }
  /onboarding/answer/:
    post:
      summary: Ответ на шаг. value по шагам — consent{ai,language?}, name{first_name,last_name?}, contact{phone?,telegram?,email?,channel?}, business{keep}|{lookup_id,index}|{name,inn?,legal_form?,city?,stage?}, activity{segment?,description?,channels?,team_size?,plan?}, pains/goals{tags,other?}, upload{source:import|zero,import_id?}, invite{invite_ids?}, install{installed}, tour{brief_time?}, summary{}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step: { type: string }
                action: { type: string, enum: [submit, skip], default: submit }
                value: { type: object, additionalProperties: true }
      responses:
        '200': { description: OnboardingState (как /onboarding/state/), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: 'invalid_step|invalid_action|invalid_value|step_required|step_not_applicable|business_required|steps_pending|demo_business|invalid_<поле>', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /onboarding/lookup/:
    post:
      summary: Поиск бизнеса по ИНН (9), ПИНФЛ (14) или названию. Сначала официальный источник (Didox, если настроен), затем открытый реестр orginfo.uz (скрейпинг). Кэш 90 дней, лимит 20/час
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [query], properties: { query: { type: string } } } } }
      responses:
        '200':
          description: LookupResult
          content:
            application/json:
              schema:
                type: object
                properties:
                  lookup_id: { type: integer }
                  kind: { type: string, enum: [inn, pinfl, name] }
                  status: { type: string, enum: [found, multiple, not_found, unavailable] }
                  source: { type: string, nullable: true }
                  official: { type: boolean }
                  fetched_at: { type: string, format: date-time }
                  candidates:
                    type: array
                    items: { type: object, properties: { name: { type: string }, inn: { type: string }, legal_form: { type: string }, status: { type: string }, registered_at: { type: string }, address: { type: string }, director: { type: string }, oked: { type: string }, activity: { type: string } } }
        '400': { description: invalid_query, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: rate_limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /onboarding/message/:
    post:
      summary: Свободный ответ агенту онбординга. С ИИ (согласие + LLM) — инструменты get_context/lookup_company/save_profile/advance_onboarding/remember; без ИИ — эвристика и say_key
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 }, step: { type: string }, lang: { type: string, enum: [ru, uz, en] } } } } }
      responses:
        '200':
          description: AgentReply
          content:
            application/json:
              schema:
                type: object
                properties:
                  say: { type: string, nullable: true }
                  say_key: { type: string, nullable: true, description: i18n-ключ onboarding.* для ответа без ИИ }
                  lookup: { type: object, nullable: true, additionalProperties: true, description: LookupResult }
                  state: { type: object, additionalProperties: true, description: OnboardingState }
        '400': { description: 'invalid_text|invalid_step|demo_business', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /onboarding/context/:
    get:
      summary: Что Oydin запомнил (ai.memory.get_context) — для итога онбординга
      responses:
        '200':
          description: '{user, memory[{id,scope,text}], business{name,inn,activity,plans,problems}|null}'
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  # ---------- People ----------
  /people/:
    get:
      summary: Люди бизнеса (сотрудники, подрядчики, покупатели, партнёры)
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { people: { type: array, items: { $ref: '#/components/schemas/Person' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Добавить человека
      description: '403 `demo_tenant` в демо-бизнесе; 400 `invalid_name` | `invalid_kind` | `invalid_pay_type` | `invalid_currency` | `invalid_pay_amount` | `invalid_date`; 404 «Точка не найдена»'
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/summary/:
    get:
      summary: Сводка по людям — штат, фонд оплаты, по точкам, текучесть за месяц
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PeopleSummary' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /people/locations/:
    get:
      summary: Точки (локации)
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { locations: { type: array, items: { $ref: '#/components/schemas/Location' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Добавить точку
      description: '403 `demo_tenant` в демо-бизнесе; 400 `invalid_name` | `invalid_address`'
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /people/locations/{id}/:
    patch:
      summary: Изменить точку
      description: '403 `demo_tenant` в демо-бизнесе; 404 «Точка не найдена»'
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить точку
      description: 403 `demo_tenant` в демо-бизнесе
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/{id}/:
    patch:
      summary: Изменить человека
      description: '403 `demo_tenant` в демо-бизнесе; 404 «Человек не найден»'
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить человека
      description: 403 `demo_tenant` в демо-бизнесе
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ---------- Rollup ----------
  /rollup/:
    get:
      summary: Сводка по всем бизнесам пользователя (только где он owner/accountant; seller-бизнесы не входят)
      description: Не требует активного бизнеса; деньги — в UZS, окно 30 дней
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Rollup' } } } }
  # ---------- Modules & widgets ----------
  /modules/:
    get:
      summary: Модули бизнеса и пресеты
      x-roles: [owner]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModulesState' } } } }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Включить / выключить модули
      description: '400 «Нужен объект modules», неизвестный модуль, не-булево значение, `money: false` («Деньги» отключить нельзя»); 403 `demo_tenant` в демо-бизнесе'
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [modules], properties: { modules: { type: object, additionalProperties: { type: boolean }, propertyNames: { $ref: '#/components/schemas/ModuleKey' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModulesState' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /modules/preset/:
    post:
      summary: Применить пресет модулей
      description: '400 «Неизвестный пресет»; 403 `demo_tenant` в демо-бизнесе'
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [preset], properties: { preset: { type: string, enum: [shop, services, creator, cafe] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModulesState' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /widgets/:
    get:
      summary: Активные виджеты включённых модулей (системные создаются при первом обращении, версия 1)
      x-roles: [owner]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { widgets: { type: array, items: { $ref: '#/components/schemas/Widget' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /widgets/usage/:
    post:
      summary: Записать событие использования виджета
      description: '400 «Неизвестный виджет» / «Неизвестное действие»; 403 `demo_tenant` в демо-бизнесе; 429 — лимит 120 запросов'
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [key, action], properties: { key: { type: string, enum: [money_summary, debts_due, people_cost, suppliers_due, stock_low, schedule_week] }, action: { type: string, enum: [view, open, dismiss, resize] } } } } }
      responses:
        '201': { description: Записано, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /widgets/proposals/:
    get:
      summary: Предложения по виджетам (последние 50)
      x-roles: [owner]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { proposals: { type: array, items: { $ref: '#/components/schemas/WidgetProposal' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Сгенерировать предложения по статистике использования
      description: 403 `demo_tenant` в демо-бизнесе
      x-roles: [owner]
      responses:
        '201': { description: Создано, content: { application/json: { schema: { type: object, properties: { created: { type: array, items: { $ref: '#/components/schemas/WidgetProposal' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /widgets/proposals/{id}/approve/:
    post:
      summary: Принять предложение — публикуется новая версия виджета
      description: '404 «Предложение не найдено»; 409 «Предложение уже обработано» / «Виджет изменился после предложения»; 403 `demo_tenant` в демо-бизнесе'
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WidgetProposal' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /widgets/proposals/{id}/reject/:
    post:
      summary: Отклонить предложение
      description: '404 «Предложение не найдено»; 409 «Предложение уже обработано»; 403 `demo_tenant` в демо-бизнесе'
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WidgetProposal' } } } }
        '403': { $ref: '#/components/responses/Error' }
