        key: { type: string }
        base_version: { type: integer }
        spec: { $ref: '#/components/schemas/WidgetSpec' }
        rationale: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    BeginnerBudgetItem:
      type: object
      required: [name, kind, amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [one_off, monthly] }
        amount: { type: integer, minimum: 0, maximum: 1000000000000 }
    BeginnerBreakeven:
      type: object
      properties:
        price: { type: [integer, 'null'] }
        unit_cost: { type: [integer, 'null'] }
        fixed_monthly: { type: [integer, 'null'] }
    BeginnerPlanInput:
      type: object
      description: Любое подмножество полей; 400 с русским текстом при невалидном значении
      properties:
        budget_items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/BeginnerBudgetItem' } }
        breakeven: { $ref: '#/components/schemas/BeginnerBreakeven' }
        checklist: { type: array, items: { type: string, enum: [budget, breakeven, form, register, bank, soliq] } }
        regime: { type: string, enum: ['', self_employed, yatt, mchj] }
    BeginnerPlan:
      type: object
      properties:
        budget_items: { type: array, items: { $ref: '#/components/schemas/BeginnerBudgetItem' } }
        totals: { type: object, properties: { one_off: { type: integer }, monthly: { type: integer } } }
        breakeven: { $ref: '#/components/schemas/BeginnerBreakeven' }
        breakeven_result:
          type: object
          description: 'Все поля null, если данных нет или маржа ≤ 0 (тогда `margin` задан)'
          properties: { margin: { type: [integer, 'null'] }, units: { type: [integer, 'null'] }, revenue: { type: [integer, 'null'] } }
        checklist: { type: array, items: { type: string } }
        regime: { type: string }
        updated_at: { type: string, format: date-time }
        registration:
          type: object
          description: Справочник форм регистрации на языке `lang`
          properties:
            columns: { type: array, items: { type: string } }
            forms: { type: array, items: { type: object, additionalProperties: true, required: [id], properties: { id: { type: string, enum: [self_employed, yatt, mchj] } } } }
            disclaimer: { type: string }
            sources_title: { type: string }
            sources: { type: array, items: { type: object, additionalProperties: true } }
    OwnerSplitInput:
      type: object
      required: [development_pct, owner_pct]
      description: Целые 0…100, в сумме 100 (иначе 400)
      properties:
        development_pct: { type: integer, minimum: 0, maximum: 100 }
        owner_pct: { type: integer, minimum: 0, maximum: 100 }
    OwnerSplit:
      type: object
      description: 'Горизонт 30 дней, суммы в UZS. `development.amount` и `owner.amount` = null, если `uncomputable_reason` задан'
      properties:
        as_of: { type: string, format: date }
        horizon_days: { type: integer }
        balance: { type: integer }
        tax_reserve: { type: integer }
        envelopes: { type: integer }
        net: { type: integer, description: balance − налоговый резерв − конверты }
        shortfall: { type: integer }
        afloat:
          type: object
          properties:
            amount: { type: integer }
            needed: { type: integer }
            payroll: { type: integer }
            obligations: { type: integer }
            payroll_unconverted: { type: array, items: { type: string } }
            items:
              type: array
              items:
                type: object
                properties: { kind: { type: string }, title: { type: string }, date: { type: string, format: date }, amount: { type: integer }, overdue: { type: boolean } }
        development: { type: object, properties: { amount: { type: [integer, 'null'] }, pct: { type: integer } } }
        owner: { type: object, properties: { amount: { type: [integer, 'null'] }, pct: { type: integer } } }
        uncomputable_reason: { type: [string, 'null'], enum: [payroll_unconverted, null] }
        configured: { type: boolean, description: Доли сохранены владельцем (иначе значения по умолчанию) }
        owner_money:
          type: object
          properties: { draw_month: { type: integer }, contribution_month: { type: integer }, draw_30d: { type: integer }, contribution_30d: { type: integer } }
    TodayItem:
      type: object
      required: [date, title, kind, amount, source, ref_id]
      properties:
        date: { type: [string, 'null'], format: date, description: 'null у средних за период' }
        title: { type: string, description: 'Название обязательства/заказа — как сохранено; для средних локализуется по `lang`' }
        kind: { type: string, description: 'salary, rent, receivable, … для обязательств; daily_sales | daily_spend для средних' }
        amount: { type: integer, description: 'UZS; расход отрицательный' }
        source: { type: string, enum: [obligation, order, average] }
        ref_id: { type: [integer, 'null'] }
        days: { type: integer, description: Только для average }
        per_day: { type: integer, description: Только для average }
    TodayAnswer:
      type: object
      required: [as_of, until, until_reason, balance, can_take, verdict, low, gap, tax_reserve, items, totals]
      description: 'Окно (today, until] включительно; деньги — целые UZS. `balance + totals.inflow + totals.outflow = totals.end_balance`'
      properties:
        as_of: { type: string, format: date }
        until: { type: string, format: date }
        until_reason: { type: string, enum: [salary_rent, friday, param], description: 'salary_rent — ближайшая неоплаченная зарплата/аренда ≤ 90 дней; friday — ближайшая пятница; param — задано `until`' }
        balance: { type: integer }
        can_take: { type: integer, description: 'max(0, low.balance − tax_reserve)' }
        verdict: { type: string, enum: [ok, tight, gap], description: 'gap — есть дыра; tight — can_take = 0 или < 10% оттока окна; иначе ok' }
        low: { type: object, description: Минимум прогнозного баланса в окне, properties: { date: { type: string, format: date }, balance: { type: integer } } }
        gap: { type: [object, 'null'], description: 'null, если прогнозный баланс в окне не уходит ниже 0; иначе date — день минимального баланса (= low.date), amount = −low.balance', properties: { date: { type: string, format: date }, amount: { type: integer } }, required: [date, amount] }
        tax_reserve: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/TodayItem' }, description: 'По дате, средние в конце' }
        totals: { type: object, required: [inflow, outflow, end_balance], properties: { inflow: { type: integer }, outflow: { type: integer }, end_balance: { type: integer } } }
paths:
  /health/:
    get:
      summary: Проверка живости
      security: []
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  # ---------- Auth ----------
  /auth/csrf/:
    get:
      summary: Выдать CSRF-cookie
      security: []
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /auth/providers/:
    get:
      summary: Доступные способы входа
      security: []
      x-roles: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [email, google, telegram, demo]
                properties: { email: { type: boolean }, google: { type: boolean }, telegram: { type: boolean }, demo: { type: boolean }, telegram_bot_id: { type: [string, 'null'], description: Числовой id бота для Telegram.Login.auth } }
  /auth/demo/:
    post:
      summary: Демо-вход
      description: 'Нужен Content-Type: application/json (иначе 415 `unsupported_media_type`); тело `{terms_version}` обязательно (иначе 400 `consent_required`); уже вошедший → 409 `already_authenticated`; 403 если демо выключено'
      security: []
      x-roles: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [terms_version], properties: { terms_version: { type: string } } } } }
      responses:
        '200': { description: Сессия создана, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /auth/telegram/:
    post:
      summary: Вход через Telegram Mini App
      security: []
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [init_data], properties: { init_data: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/email/request/:
    post:
      summary: Запросить код входа на email
      security: []
      x-roles: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '200':
          description: Код отправлен
          content: { application/json: { schema: { type: object, required: [ok, resend_in], properties: { ok: { type: boolean }, resend_in: { type: integer, description: Секунд до повторной отправки } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/email/verify/:
    post:
      summary: Войти по коду из email
      security: []
      x-roles: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string, format: email }, code: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/google/start/:
    get:
      summary: Начать вход через Google (редирект)
      security: []
      x-roles: []
      parameters:
        - { name: next, in: query, schema: { type: string }, description: Относительный путь возврата }
      responses:
        '302': { description: Редирект на Google }
        '503': { $ref: '#/components/responses/Error' }
  /auth/google/callback/:
    get:
      summary: Callback Google OAuth (редирект на next или /?auth_error=<код>)
      security: []
      x-roles: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: Редирект }
  /auth/logout/:
    post:
      summary: Выйти
      security: []
      x-roles: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /auth/me/:
    get:
      summary: Текущий пользователь
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/:
    get:
      summary: Текущий пользователь (алиас /auth/me/)
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /consents/:
    get:
      summary: Согласия пользователя
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Consents' } } } }
    put:
      summary: Обновить согласия (частично)
      x-roles: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentsInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Consents' } } } }
        '400': { $ref: '#/components/responses/Error' }
  # ---------- Businesses ----------
  /business/:
    patch:
      summary: Налоговый режим активного бизнеса
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { tax_regime: { $ref: '#/components/schemas/TaxRegime' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Business' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /businesses/:
    get:
      summary: Мои бизнесы
      x-roles: []
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BusinessItem' } } } } } }
    post:
      summary: Создать бизнес (вызывающий становится owner)
      x-roles: []
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/BusinessInput' }, { required: [name] }] } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/:
    patch:
      summary: Изменить бизнес (не демо)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BusinessInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/switch/:
    post:
      summary: Сделать бизнес активным
      x-roles: []
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/members/:
    get:
      summary: Участники бизнеса
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Пригласить по email (ожидающее членство)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' } } } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/members/{member_id}/:
    patch:
      summary: Сменить роль (400 invalid_role, last_owner)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/MemberId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Убрать участника (400 last_owner)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/MemberId' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/invites/:
    get:
      summary: Ссылки-приглашения бизнеса
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Создать ссылку-приглашение (400 invalid_role, invalid_max_uses, invalid_expires_in_hours; 429 rate_limited — 20 в час)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/BusinessId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [accountant, seller] }
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                max_uses: { type: integer, minimum: 1, maximum: 100, default: 1 }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /businesses/{business_id}/invites/{invite_id}/:
    delete:
      summary: Отозвать ссылку (идемпотентно)
      x-roles: [owner]
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: invite_id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /invites/{code}/:
    get:
      summary: Предпросмотр приглашения без входа (название бизнеса и роль; 404 not_found; 410 invite_expired|invite_revoked|invite_used_up)
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [business_name, role, expires_at], properties: { business_name: { type: string }, role: { type: string, enum: [accountant, seller] }, expires_at: { type: string, format: date-time } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /invites/{code}/accept/:
    post:
      summary: 'Принять приглашение — членство создаётся, бизнес становится активным (уже участник: роль не меняется, использование не считается)'
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  # ---------- Finance ----------
  /dashboard/pulse/:
    get:
      summary: Пульс бизнеса (поля revenue_week, safe_reason, reserved_upcoming; период from/to влияет только на итоги периода)
      x-roles: [owner, accountant]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pulse' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /accounts/:
    get:
      summary: Счета (seller — без остатков)
      x-roles: [owner, accountant, seller]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Account' } } } } } }
    post:
      summary: Создать счёт (не демо)
