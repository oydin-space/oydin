      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreate' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /accounts/{id}/:
    patch:
      summary: Переименовать счёт
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 100 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить счёт (409 account_in_use, если есть операции, сверки кассы или регулярные платежи)
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rates/:
    get:
      summary: Курс USD (ЦБ)
      x-roles: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Rates' } } } }
  /transactions/:
    get:
      summary: Операции (seller — только свои)
      x-roles: [owner, accountant, seller]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, confirmed] } }
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/Purpose' } }
        - { name: q, in: query, schema: { type: string }, description: Поиск }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Transaction' } } } } } }
    post:
      summary: Создать операцию (подтверждённая, source=manual; событие transaction.created)
      description: seller не может использовать purpose owner_draw / owner_contribution (403)
      x-roles: [owner, accountant, seller]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /transactions/{id}/:
    patch:
      summary: Изменить операцию (в т.ч. to_account_id, status; draft → confirmed → transaction.confirmed)
      description: '400 `transfer_currency_mismatch` — счета перевода в разных валютах (так же для POST /transactions/ и /sync/)'
      x-roles: [owner, accountant, seller]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransactionPatch' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить операцию
      x-roles: [owner, accountant, seller]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /obligations/:
    get:
      summary: Обязательства
      x-roles: [owner, accountant]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Obligation' } } } } } }
    post:
      summary: Создать обязательство
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ObligationInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Obligation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /envelopes/:
    get:
      summary: Конверты накоплений
      x-roles: [owner, accountant]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Envelope' } } } } } }
  /forecast/:
    get:
      summary: Прогноз остатка
      x-roles: [owner, accountant]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 90 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [points], properties: { points: { type: array, items: { $ref: '#/components/schemas/ForecastPoint' } } } } } }
  /products/:
    get:
      summary: Товары (seller — без себестоимости и маржи)
      x-roles: [owner, accountant, seller]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } } } } } }
  /orders/:
    get:
      summary: Заказы
      x-roles: [owner, accountant]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } }
  /analytics/summary/:
    get:
      summary: Сводка за период
      x-roles: [owner, accountant]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month, quarter] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsSummary' } } } }
  /insights/:
    get:
      summary: Инсайты
      x-roles: [owner, accountant]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Insight' } } } } } }
  # ---------- AI ----------
  /ai/chat/:
    post:
      summary: Чат с AI-финдиректором
      description: Нужно согласие `ai` (403 ai_consent_required); seller → 403; лимит запросов → 429
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ChatMessage' }, description: Последнее сообщение — от user }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AiReply' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /ai/voice/:
    post:
      summary: Голосовая запись операции
      description: Нужно согласие `ai`; audio ≤ 2 МБ, не пустое
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [audio], properties: { audio: { type: string, format: binary } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [text, draft]
                properties:
                  text: { type: string }
                  draft: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Transaction' }] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /ai/feedback/:
    post:
      summary: Оценка ответа AI
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [trace_id, value], properties: { trace_id: { type: string }, value: { type: integer, enum: [0, 1] } } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/Error' }
  /ai/tools/generate/:
    post:
      summary: Сгенерировать инструмент (OpenUI Lang)
      description: |
        Встроенные виды работают без модели; `kind=custom` требует `prompt` и согласие `ai`. 400 `unsupported_kind` (в т.ч. tax), `invalid`;
        503/502 `ai_unavailable`.
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, maxLength: 4000 }
                kind: { $ref: '#/components/schemas/ToolKind' }
                lang: { $ref: '#/components/schemas/Locale' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GeneratedTool' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ai/memory/:
    get:
      summary: Память ИИ (факты о бизнесе и о пользователе)
      description: Нужно согласие `ai` (403 ai_consent_required); seller → 403. Личные факты видит только их автор.
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MemoryFact' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /ai/memory/{id}/:
    delete:
      summary: Забыть факт памяти
      description: Нужно согласие `ai`; чужой личный факт или факт другого бизнеса → 404
      x-roles: [owner, accountant]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Удалено }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ---------- Tools ----------
  /tools/:
    get:
      summary: Сохранённые инструменты (закреплённые первыми, затем по updated_at)
      description: 'Ответ — массив, не `{items}`'
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedTool' } } } } }
    post:
      summary: Сохранить инструмент
      description: 400 `invalid_title`, `unsupported_kind`, `invalid_spec`, `invalid_values`
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SavedToolInput' }, { required: [title, spec] }] } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tools/templates/:
    get:
      summary: Готовые шаблоны инструментов
      description: Ответ — массив
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ToolTemplate' } } } } }
  /tools/{id}/:
    get:
      summary: Инструмент
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Изменить инструмент (400 invalid_pinned и др.)
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavedToolInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SavedTool' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить инструмент
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '404': { $ref: '#/components/responses/Error' }
  # ---------- Planning ----------
  /decisions/afford/:
    post:
      summary: «Могу ли я позволить?» — вердикт yes / risky / no
      description: 400 «Дата не дальше 90 дней»; 503 `no_rate`
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AffordInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AffordResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /cash-close/:
    get:
      summary: Сверки кассы
      x-roles: [owner, accountant]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: account_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CashClose' } } } } } }
    post:
      summary: Закрыть кассу за день
      description: 409 `already_closed`; будущая дата → 400; одинаковый Idempotency-Key + тело → первый ответ, иное тело → 409 `idempotency_conflict`
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CashCloseInput' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/CashClose' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /cash-close/expected/:
    get:
      summary: Ожидаемый остаток на конец дня
      x-roles: [owner, accountant]
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [account_id, date, currency, expected]
                properties: { account_id: { type: integer }, date: { type: string, format: date }, currency: { $ref: '#/components/schemas/Currency' }, expected: { type: integer } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /cash-close/{id}/:
    patch:
      summary: Исправить сверку (пересчитывает difference)
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { counted: { type: integer, minimum: 0 }, note: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CashClose' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
