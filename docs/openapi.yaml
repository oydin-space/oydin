  # ───────────── v0.2: auth ─────────────
  /auth/telegram/widget/:
    post:
      security: []
      summary: Вход через Telegram Login Widget на вебе; проверка hash = HMAC-SHA256(SHA256(bot_token), data_check_string), auth_date ≤ 24ч
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, auth_date, hash]
              properties:
                id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
                photo_url: { type: string }
                auth_date: { type: integer }
                hash: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/google/start/:
    get:
      security: []
      summary: Редирект на Google OAuth (state в сессии, PKCE). purpose=login — openid email profile; purpose=sheets — + spreadsheets + drive.file, требует сессию и integrations.manage
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [login, sheets], default: login } }
        - { name: next, in: query, schema: { type: string }, description: Относительный путь для возврата }
      responses:
        '302': { description: Redirect на accounts.google.com }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/google/callback/:
    get:
      security: []
      summary: Обмен code→tokens. login — создаёт/входит пользователя; sheets — создаёт Connection(kind=google_sheets) с зашифрованным refresh_token
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 'Redirect на next (по умолчанию /app или /app/settings/integrations); при ошибке ?error=<code>' }
        '400': { $ref: '#/components/responses/Error' }
  /legal/consent/:
    get:
      security: []
      summary: Актуальная версия юр. документов
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, documents]
                properties:
                  version: { type: string, example: '2026-11-18' }
                  documents: { type: array, items: { type: object, required: [kind, url], properties: { kind: { type: string, enum: [privacy, terms] }, url: { type: string } } } }
        '500': { $ref: '#/components/responses/Error' }
    post:
      summary: Принять версию (пишется ConsentRecord с IP/UA/временем)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /pricing/access-request/:
    post:
      security: []
      summary: Заявка на доступ к Pro / партнёрство банка (без оплаты). Rate limit 5/ч на IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, contact, plan]
              properties:
                name: { type: string, maxLength: 120 }
                contact: { type: string, maxLength: 120, description: Телефон, email или @telegram }
                plan: { type: string, enum: [pro, team, bank_partner] }
                business_name: { type: string, maxLength: 120 }
                segment: { $ref: '#/components/schemas/Segment' }
                message: { type: string, maxLength: 2000 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
