openapi: 3.1.0
info:
  title: Oydin API
  version: 0.3.0
  description: |
    Второй мозг для малого бизнеса. Даты — ISO 8601 (YYYY-MM-DD). Ошибки: `{"error": "<code>"}`. Пути заканчиваются на `/`.

    **Деньги.** Суммы — целые числа в минимальной единице валюты счёта (UZS — сум, USD — центы). `Account.currency` ∈ UZS|USD.
    Все итоги (пульс, прогноз, отчёты, afford, impact) — в UZS по последнему сохранённому курсу ЦБ (`GET /rates/`, источник cbu.uz).

    **Аутентификация.** Django session cookie (`sessionid`); вход — email-код, Google OAuth, Telegram Mini App / Login Widget, демо.
    Мутирующие запросы с cookie требуют `X-CSRFToken` (`GET /auth/csrf/`). Публичный API — `/v1/` с `Authorization: Bearer oyd_…`.

    **Тенантность.** Тенант — `Business` (в UI «организация»). Доступ — через `Membership(user, business, role)`; один пользователь
    может состоять в нескольких бизнесах. Все бизнес-эндпоинты работают в контексте **активного** бизнеса (`Me.active_business_id`,
    переключается `POST /businesses/{id}/switch/`). Нет членства → `needs_onboarding: true`, бизнес-эндпоинты → 403 `{"error":"no_business"}`.

    **Роли** (расширение `x-roles` на каждой операции — какие роли активного бизнеса могут её вызвать; `[]` — роль не нужна:
    публичный эндпоинт или любой вошедший пользователь, см. `security`). Чужая роль → 403 `{"error":"forbidden"}`.
    - owner — всё;
    - accountant — читает всё; пишет операции и обязательства (вкл. налоговый резерв/напоминания, сверку кассы); без команды, настроек, интеграций, API-токенов, ссылок доступа и согласий;
    - seller — создаёт операции/черновики и видит только свои операции; без остатков, прогноза и отчётов.

    Язык ответов AI и уведомлений — `Me.locale` (fallback `Business.locale`).

    ## Changelog 0.3.0
    Добавлено: email-вход и `/auth/providers/`; мультибизнес (`/businesses/*`, участники по email); валюты UZS/USD и `/rates/`;
    `/decisions/afford/`; `/onboarding/`; ссылки для бухгалтера (`/share-links/*`, `/shared/{token}/*`); ежедневная сверка кассы
    (`/cash-close/*`); виды операций `owner_draw` / `owner_contribution` и `/reports/period/` (прибыль vs деньги vs изъятия);
    налоговый резерв + подтверждённые напоминания (`/tax/*`); еженедельный текстовый дайджест (`/digest/weekly/`); кабинет партнёра
    (`/partner/*`) и согласия (`/consents/partner/*`); публичный `/impact/`; офлайн-синхронизация (`Idempotency-Key` на
    `POST /operations/`, `POST /sync/`); каталог интеграций со статусами.

    Удалено / переименовано (решения раунда 3, `docs/decisions.md`):
    - `/me/` → `/auth/me/` (GET, PATCH);
    - `/business/` PATCH → `PATCH /businesses/{id}/`;
    - `/team/members/*` → `/businesses/{id}/members/*`; `/team/invites/`, `/team/invites/{id}/`, `/team/join/` удалены (приглашение по email в `POST /businesses/{id}/members/`);
    - `/transactions/`, `/transactions/{id}/` → `/operations/`, `/operations/{id}/`; схемы `Transaction*` → `Operation*` (публичный `/v1/transactions/` и событие `transaction.created` не меняются);
    - `POST /integrations/` (ввод кредов Payme/Click/Uzum Market/Moysklad/Billz/Didox/Faktura) удалён — эти интеграции `coming_soon` без кода; `GET /integrations/` теперь каталог; подключение только Google Sheets через OAuth;
    - `ImportKind` kapitalbank/tbc/uzum_business/hamkorbank удалены (пресеты банков — `coming_soon`; выписки идут через csv/xlsx с маппингом);
    - `Business.tax_regime` и PATCH-поле `tax_regime` удалены; налоговых калькуляторов/пресетов ставок нет (вариант B из `docs/research/tax-fit.md`);
    - `Goal.streak_days`, `Goal.best_streak` удалены (streaks убраны);
    - `Benchmark` удалён; `GET /benchmarks/` возвращает `{"status":"coming_soon"}` до появления когорт;
    - `NotificationSettings.weekly_cfo_call`/`weekly_cfo_weekday` → `weekly_digest`/`weekly_digest_weekday` (текст в Telegram; голос — coming_soon); `notifications/test` kind `weekly_cfo_call` → `weekly_digest`;
    - `ForecastPoint.event` удалено; `seasonality` считается только по истории самого бизнеса;
    - схема `User` → `Me`.
servers:
  - url: /api
security:
  - session: []
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sessionid }
    bearer: { type: http, scheme: bearer, description: 'Персональный токен `oyd_<base62>`; в БД хранится только SHA-256' }
    telegramSecret: { type: apiKey, in: header, name: X-Telegram-Bot-Api-Secret-Token }
  responses:
    Error:
      description: Ошибка (400 валидация, 401 нет сессии/токена, 403 нет прав, 404 не найдено, 409 конфликт, 410 истекло/отозвано, 413 файл велик, 429 лимит, 502 внешний сервис, 503 не настроено)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    BusinessId: { name: id, in: path, required: true, schema: { type: integer }, description: Business id }
    MemberId: { name: member_id, in: path, required: true, schema: { type: integer } }
    Token: { name: token, in: path, required: true, schema: { type: string }, description: Токен ссылки доступа (≥ 32 символа base62) }
    PartnerId: { name: partner_id, in: path, required: true, schema: { type: integer } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 80 }, description: 'Повтор с тем же ключом в течение 24ч возвращает первый ответ (200); тот же ключ с другим телом → 409 {"error":"idempotency_conflict"}' }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Tone:
      type: string
      enum: [calm, watch, risk]
      description: calm — всё хорошо, watch — обратить внимание, risk — нужен шаг сейчас
    Locale: { type: string, enum: [ru, uz, en], description: 'uz — латиница' }
    Role: { type: string, enum: [owner, accountant, seller] }
    Currency: { type: string, enum: [UZS, USD] }
    Permission:
      type: string
      enum: [transactions.read_all, transactions.write, reports.read, imports.manage, exports.read, team.manage, integrations.manage, tokens.manage, settings.manage]
      description: |
        owner — все; accountant — transactions.read_all, transactions.write, reports.read, imports.manage, exports.read;
        seller — transactions.write (только свои операции).
    BusinessRef:
      type: object
      required: [id, name, role, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_demo: { type: boolean }
    Me:
      type: object
      required: [id, name, email, is_staff, locale, role, permissions, active_business_id, needs_onboarding, businesses, business, consent_version]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, 'null'] }
        is_staff: { type: boolean }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Role' }], description: Роль в активном бизнесе }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        active_business_id: { type: [integer, 'null'] }
        needs_onboarding: { type: boolean, description: true — у пользователя нет ни одного членства }
        businesses: { type: array, items: { $ref: '#/components/schemas/BusinessRef' } }
        business: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Business' }], description: Активный бизнес }
        consent_version: { type: [string, 'null'], description: 'Принятая версия юр. документов; null или < актуальной → consent screen' }
        telegram_linked: { type: boolean }
        google_linked: { type: boolean }
    Business:
      type: object
      required: [id, name, industry, city, locale, segment, plan, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        segment: { $ref: '#/components/schemas/Segment' }
        plan: { type: string, enum: [free, pro], description: Биллинга нет; pro выдаётся вручную по заявке доступа }
        is_demo: { type: boolean }
    BusinessListItem:
      type: object
      required: [id, name, industry, city, role, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_demo: { type: boolean }
    Segment: { type: string, enum: [textile_print, retail, horeca, marketplace_seller, services] }
    Member:
      type: object
      required: [id, user_id, name, email, invited_email, role, status, created_at]
      properties:
        id: { type: integer, description: Membership id }
        user_id: { type: [integer, 'null'], description: null — приглашение ещё не принято }
        name: { type: string }
        email: { type: [string, 'null'] }
        invited_email: { type: [string, 'null'], description: 'Email приглашения; членство привязывается при первом входе с этим email' }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, invited] }
        created_at: { type: string, format: date-time }
    Rates:
      type: object
      required: [date, USD, source, stale]
      properties:
        date: { type: string, format: date }
        USD: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: 'UZS за 1 USD (Rate/Nominal), десятичная строка', example: '12010.45' }
        source: { type: string, example: cbu.uz }
        stale: { type: boolean, description: Курс старше последнего рабочего дня ЦБ (не удалось обновить) }
    Pulse:
      type: object
      required: [score, tone, headline, balance, safe_to_spend, runway_days, promises, gap, metrics, currency, rate_date]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, description: Индекс живучести }
        tone: { $ref: '#/components/schemas/Tone' }
        headline: { type: string, description: 'Одна фраза, напр. "Зарплату 10-го закроете спокойно"' }
        currency: { type: string, const: UZS }
        rate_date: { type: [string, 'null'], format: date, description: Дата курса USD, использованного для пересчёта }
        balance: { type: integer }
        safe_to_spend: { type: integer, description: 'Можно потратить сегодня, не задев обязательства, конверты и налоговый резерв' }
        runway_days: { type: integer }
        unexplained_difference: { type: integer, description: Сумма необъяснённых расхождений последней сверки кассы }
        promises:
          type: object
          required: [kept, total]
          properties: { kept: { type: integer }, total: { type: integer } }
        gap:
          description: Ближайший кассовый разрыв в горизонте 30 дней или null
          oneOf:
            - type: 'null'
            - type: object
              required: [date, amount, reason]
              properties:
                date: { type: string, format: date }
                amount: { type: integer }
                reason: { type: string }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
    Metric:
      type: object
      required: [key, label, value, unit, tone, hint]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [sum, pct, days, count] }
        tone: { $ref: '#/components/schemas/Tone' }
        hint: { type: string }
        trend:
          type: array
          items: { type: number }
    Insight:
      type: object
      required: [id, kind, title, body, tone, source, as_of, confidence]
      properties:
        id: { type: string }
        kind: { type: string, enum: [market, local, tax, own] }
        title: { type: string }
        body: { type: string }
        tone: { $ref: '#/components/schemas/Tone' }
        source: { type: string }
        source_url: { type: [string, 'null'] }
        as_of: { type: string, format: date }
        confidence: { type: string, enum: [high, medium, low] }
        action: { type: [string, 'null'], description: Вопрос для чата по клику }
    Account:
      type: object
      required: [id, name, kind, currency, balance, balance_uzs]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [cash, card, bank] }
        currency: { $ref: '#/components/schemas/Currency' }
        balance: { type: [integer, 'null'], description: 'В минимальной единице валюты счёта; null для seller' }
        balance_uzs: { type: [integer, 'null'], description: 'Пересчёт по последнему курсу; null для seller' }
    OperationKind:
      type: string
      enum: [regular, owner_draw, owner_contribution]
      description: owner_draw — изъятие владельца, owner_contribution — вложение владельца; не входят в прибыль, но меняют деньги
    Operation:
      type: object
      required: [id, date, amount, currency, amount_uzs, direction, kind, category, purpose, account_id, note, status, source, created_by]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        amount: { type: integer, minimum: 1, description: В минимальной единице валюты счёта }
        currency: { $ref: '#/components/schemas/Currency' }
        amount_uzs: { type: integer, description: Пересчёт по курсу на дату операции }
        direction: { type: string, enum: [in, out, transfer] }
        kind: { $ref: '#/components/schemas/OperationKind' }
        category: { type: string }
        purpose:
          type: string
          enum: [business, personal, unclear]
          description: целевая (business) / нецелевая (personal) трата
        account_id: { type: integer }
        counterparty: { type: [string, 'null'] }
        note: { type: string }
        status: { type: string, enum: [draft, confirmed] }
        source: { type: string, enum: [manual, voice, chat, import, seed, integration, ocr, telegram, api, offline] }
        created_by: { type: [integer, 'null'], description: User id автора }
        client_id: { type: [string, 'null'], description: Клиентский uuid офлайн-записи }
    OperationInput:
      type: object
      required: [amount, direction, category, account_id]
      properties:
        date: { type: string, format: date }
        amount: { type: integer, minimum: 1 }
        direction: { type: string, enum: [in, out, transfer] }
        kind: { $ref: '#/components/schemas/OperationKind' }
        category: { type: string }
        purpose: { type: string, enum: [business, personal, unclear] }
        account_id: { type: integer }
        counterparty: { type: [string, 'null'] }
        note: { type: string }
        status: { type: string, enum: [draft, confirmed], default: confirmed }
        client_id: { type: string, maxLength: 64 }
    Obligation:
      type: object
      required: [id, title, kind, amount, due_date, status, covered]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [salary, rent, tax, supplier, loan, other, receivable] }
        amount: { type: integer, description: UZS }
        due_date: { type: string, format: date }
        status: { type: string, enum: [planned, paid, overdue] }
        covered: { type: boolean, description: Хватает ли прогнозного остатка на дату }
    Envelope:
      type: object
      required: [id, title, kind, target, saved, due_date, daily]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [regular, tax_reserve] }
        target: { type: integer }
        saved: { type: integer }
        due_date: { type: [string, 'null'], format: date }
        daily: { type: integer, description: Сколько откладывать в день }
    ForecastPoint:
      type: object
      required: [date, balance, inflow, outflow, seasonality]
      properties:
        date: { type: string, format: date }
        balance: { type: integer, description: UZS }
        inflow: { type: integer }
        outflow: { type: integer }
        seasonality: { type: number, description: 'Множитель выручки (1.0 — норма) только по собственной истории бизнеса; 1.0 при истории < 12 мес' }
    Product:
      type: object
      required: [id, name, price, unit_cost, margin_pct, markup_pct, cost_is_estimate]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: integer }
        unit_cost: { type: integer }
        margin_pct: { type: number }
        markup_pct: { type: number }
        cost_is_estimate: { type: boolean }
    Order:
      type: object
      required: [id, client, channel, total, prepaid, status, due_date, items]
      properties:
        id: { type: integer }
        client: { type: string }
        channel: { type: string, enum: [retail, showroom, b2b, online] }
        total: { type: integer }
        prepaid: { type: integer }
        status: { type: string, enum: [brief, sample, production, qc, delivered, paid] }
        due_date: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [product_id, qty, price]
            properties:
              product_id: { type: integer }
              qty: { type: integer }
              price: { type: integer }
    Chart:
      type: object
      required: [type, title, unit, data]
      properties:
        type: { type: string, enum: [bar, line, area, pie] }
        title: { type: string }
        unit: { type: string }
        data:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [label, value]
            properties: { label: { type: string }, value: { type: number } }
    AiReply:
      type: object
      required: [reply, suggestions, trace_id, ui]
      properties:
        reply: { type: string, description: Markdown на языке пользователя }
        suggestions: { type: array, items: { type: string }, maxItems: 4 }
        chart: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Chart' }] }
        ui:
          type: [string, 'null']
          maxLength: 50000
          description: OpenUI Lang — генеративный интерфейс на компонентах Oydin; можно закрепить через POST /tools/.
        draft:
          description: Предложенная операция — сохраняется только после подтверждения пользователем
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/OperationInput' }]
        trace_id: { type: [string, 'null'] }
        fallback: { type: boolean }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    AffordInput:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1, description: В минимальной единице currency }
        currency: { $ref: '#/components/schemas/Currency' }
        date: { type: string, format: date, description: По умолчанию сегодня; не дальше 90 дней }
        title: { type: string, maxLength: 120 }
    AffordAlternative:
      type: object
      required: [kind, title, verdict]
      properties:
        kind: { type: string, enum: [later_date, split, smaller_amount, after_receivable] }
        title: { type: string }
        date: { type: [string, 'null'], format: date }
        amount: { type: [integer, 'null'], description: UZS }
        verdict: { type: string, enum: [yes, risky, no] }
    AffordResult:
      type: object
      required: [verdict, amount_uzs, min_balance_after, min_balance_date, gap_date, explanation, alternatives]
      properties:
        verdict: { type: string, enum: [yes, risky, no], description: 'yes — минимум остатка ≥ подушки; risky — ≥ 0, но ниже подушки/резервов; no — уходит в минус' }
        amount_uzs: { type: integer }
        min_balance_after: { type: integer, description: Минимальный прогнозный остаток (UZS) в горизонте 30 дней после покупки }
        min_balance_date: { type: string, format: date }
        gap_date: { type: [string, 'null'], format: date, description: Дата первого разрыва, если покупка его создаёт }
        explanation: { type: string, description: 1–2 предложения на языке пользователя; без AI-фантазий — из прогноза }
        alternatives: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/AffordAlternative' } }
    OnboardingState:
      type: object
      required: [step, business_id, notes_count, notes_required, import_id, pulse]
      properties:
        step: { type: string, enum: [business, data, first_pulse, done], description: 'business → data (выписка или 3 заметки голосом/текстом) → first_pulse → done' }
        business_id: { type: [integer, 'null'] }
        notes_count: { type: integer }
        notes_required: { type: integer, const: 3 }
        import_id: { type: [integer, 'null'] }
        drafts: { type: array, items: { $ref: '#/components/schemas/OperationInput' }, description: Черновики из заметок, ожидают подтверждения }
        pulse: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Pulse' }] }
    OnboardingAction:
      oneOf:
        - type: object
          required: [action, name]
          properties:
            action: { const: business }
            name: { type: string, maxLength: 120 }
            industry: { type: string }
            city: { type: string }
            segment: { $ref: '#/components/schemas/Segment' }
            currency: { $ref: '#/components/schemas/Currency', description: Валюта первого счёта (по умолчанию UZS) }
        - type: object
          required: [action, text]
          properties:
            action: { const: note }
            text: { type: string, maxLength: 1000, description: 'Текстовая или распознанная голосовая заметка, напр. "вчера продал на 2 млн"' }
        - type: object
          required: [action, import_id]
          properties:
            action: { const: statement }
            import_id: { type: integer, description: Импорт из POST /imports/ (будет закоммичен) }
        - type: object
          required: [action]
          properties:
            action: { type: string, enum: [confirm_drafts, finish] }
      discriminator: { propertyName: action }
    ShareLink:
      type: object
      required: [id, label, url, period_from, period_to, expires_at, revoked_at, created_at, views, last_viewed_at]
      properties:
        id: { type: integer }
        label: { type: string }
        url: { type: string, description: 'https://oydin.sayfi.uz/shared/<token>' }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        expires_at: { type: string, format: date-time, description: По умолчанию 30 дней, максимум 180 }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        views: { type: integer }
        last_viewed_at: { type: [string, 'null'], format: date-time }
    ShareLinkInput:
      type: object
      properties:
        label: { type: string, maxLength: 120 }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        expires_at: { type: string, format: date-time }
    PeriodResult:
      type: object
      required: [period_from, period_to, currency, revenue, expenses, profit, cash_change, owner_draws, owner_contributions, missing_data]
      properties:
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        currency: { type: string, const: UZS }
        revenue: { type: integer }
        expenses: { type: integer }
        profit: { type: [integer, 'null'], description: null — не хватает данных (себестоимость/обязательства) }
        cash_change: { type: integer, description: Изменение денег на всех счетах }
        owner_draws: { type: integer }
        owner_contributions: { type: integer }
        missing_data: { type: array, items: { type: string, enum: [unit_costs, obligations, unexplained_cash, unclear_purpose] } }
    SharedReport:
      type: object
      required: [business_name, generated_at, period, accounts, by_category, obligations, cash_closes, tax_reserve, disclaimer]
      properties:
        business_name: { type: string }
        generated_at: { type: string, format: date-time }
        period: { $ref: '#/components/schemas/PeriodResult' }
        accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
        by_category: { type: array, items: { type: object, required: [category, inflow, outflow], properties: { category: { type: string }, inflow: { type: integer }, outflow: { type: integer } } } }
        obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
        cash_closes: { type: array, items: { $ref: '#/components/schemas/CashClose' } }
        tax_reserve: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TaxReserve' }] }
        disclaimer: { type: string }
    CashClose:
      type: object
      required: [id, date, account_id, currency, expected, counted, difference, note, created_by, created_at]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        account_id: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        expected: { type: integer, description: Остаток по записям на конец дня }
        counted: { type: integer, description: Фактически пересчитано }
        difference: { type: integer, description: counted − expected; ≠ 0 — необъяснённая разница }
        note: { type: string, description: Объяснение разницы }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
    TaxReserve:
      type: object
      required: [enabled, method, fixed_amount, percent, period, period_from, period_to, base_amount, reserved, provenance, disclaimer]
      description: Планирование денежного резерва; не расчёт налога к уплате
      properties:
        enabled: { type: boolean }
        method: { type: string, enum: [fixed, percent] }
        fixed_amount: { type: [integer, 'null'], description: UZS за период }
        percent: { type: [string, 'null'], pattern: '^[0-9]{1,2}(\.[0-9]{1,2})?$', description: 'Процент, введённый пользователем; пресетов нет' }
        period: { type: string, enum: [month, quarter] }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        base_categories: { type: array, items: { type: string }, description: 'Категории поступлений в базе (без переводов, займов, вложений владельца и личных)' }
        base_amount: { type: integer, description: Сумма поступлений в базе за период }
        reserved: { type: integer, description: Плановый резерв, уменьшает safe_to_spend }
        confirmed_amount: { type: [integer, 'null'], description: Сумма, подтверждённая бухгалтером/владельцем, заменяет оценку }
        provenance: { type: string, enum: [user_setting, accountant_confirmed, planning_estimate] }
        disclaimer: { type: string }
    TaxReserveInput:
      type: object
      required: [enabled, method, period]
      properties:
        enabled: { type: boolean }
        method: { type: string, enum: [fixed, percent] }
        fixed_amount: { type: [integer, 'null'], minimum: 0 }
        percent: { type: [string, 'null'], pattern: '^[0-9]{1,2}(\.[0-9]{1,2})?$' }
        period: { type: string, enum: [month, quarter] }
        base_categories: { type: array, items: { type: string } }
        confirmed_amount: { type: [integer, 'null'], minimum: 0 }
    TaxReminder:
      type: object
      required: [id, title, kind, due_date, amount, status, provenance, notify_telegram, confirmed_by, confirmed_at, obligation_id]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [payment, report] }
        due_date: { type: string, format: date }
        amount: { type: [integer, 'null'], description: UZS; для payment создаёт/обновляет Obligation(kind=tax) }
        status: { type: string, enum: [planned, done] }
        provenance: { type: string, enum: [user_setting, accountant_confirmed] }
        notify_telegram: { type: boolean }
        confirmed_by: { type: integer, description: User, подтвердивший дату }
        confirmed_at: { type: string, format: date-time }
        obligation_id: { type: [integer, 'null'] }
    TaxReminderInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        kind: { type: string, enum: [payment, report] }
        due_date: { type: string, format: date }
        amount: { type: [integer, 'null'], minimum: 1 }
        status: { type: string, enum: [planned, done] }
        notify_telegram: { type: boolean }
        confirmed: { type: boolean, const: true, description: Пользователь подтверждает дату сам — обязательно при создании }
    WeeklyDigest:
      type: object
      required: [week_start, week_end, text, inflow, outflow, owner_draws, cash_change, next_gap, upcoming]
      properties:
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        text: { type: string, description: Текст для Telegram (Markdown) на языке пользователя }
        inflow: { type: integer }
        outflow: { type: integer }
        owner_draws: { type: integer }
        cash_change: { type: integer }
        next_gap: { type: [string, 'null'], format: date }
        upcoming: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
    Partner:
      type: object
      required: [id, name, kind, logo_url]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [bank, mfo] }
        logo_url: { type: [string, 'null'] }
    PartnerConsent:
      type: object
      required: [partner, granted, granted_at, revoked_at, scope]
      properties:
        partner: { $ref: '#/components/schemas/Partner' }
        granted: { type: boolean }
        granted_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        scope: { type: string, description: Текст согласия (какие анонимные поля видит партнёр) }
    PartnerLead:
      type: object
      required: [id, segment, city, months_active, revenue_band, gap_amount_band, gap_date, consented_at, status]
      description: Анонимизировано — без названия, контактов, операций. Видны только лиды с действующим согласием
      properties:
        id: { type: string, description: Псевдоним, стабилен для пары партнёр–бизнес }
        segment: { $ref: '#/components/schemas/Segment' }
        city: { type: string }
        months_active: { type: integer }
        revenue_band: { type: string, enum: ['<50m', 50m-200m, 200m-1b, '>1b'], description: Выручка за 90 дней, UZS }
        gap_amount_band: { type: [string, 'null'], enum: ['<10m', 10m-50m, 50m-200m, '>200m', null] }
        gap_date: { type: [string, 'null'], format: date }
        consented_at: { type: string, format: date-time }
        status: { type: string, enum: [new, contacted, closed] }
    Impact:
      type: object
      required: [businesses, operations_recorded, cash_closes, gaps_flagged, updated_at]
      properties:
        businesses: { type: integer, description: Активные бизнесы (не демо) }
        operations_recorded: { type: integer }
        cash_closes: { type: integer }
        gaps_flagged: { type: integer, description: Разрывы, замеченные заранее (≥ 3 дней) }
        updated_at: { type: string, format: date-time }
    SyncItem:
      type: object
      required: [client_id, kind, payload]
      properties:
        client_id: { type: string, maxLength: 64, description: Клиентский uuid; повтор — duplicate }
        kind: { type: string, enum: [operation, cash_close] }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/OperationInput' }
            - { $ref: '#/components/schemas/CashCloseInput' }
    SyncResult:
      type: object
      required: [client_id, status, id, error]
      properties:
        client_id: { type: string }
        status: { type: string, enum: [created, duplicate, error] }
        id: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
    CashCloseInput:
      type: object
      required: [account_id, counted]
      properties:
        date: { type: string, format: date, description: По умолчанию сегодня }
        account_id: { type: integer }
        counted: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500 }
    Goal:
      type: object
      required: [id, kind, title, target, current, due_date, status]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [safety_cushion, savings, revenue, expense_cap, no_personal_leaks] }
        title: { type: string }
        target: { type: integer, description: 'UZS (для safety_cushion — дни запаса × средний дневной расход)' }
        current: { type: integer }
        due_date: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, achieved, archived] }
    GoalInput:
      type: object
      required: [kind, title, target]
      properties:
        kind: { type: string, enum: [safety_cushion, savings, revenue, expense_cap, no_personal_leaks] }
        title: { type: string, maxLength: 120 }
        target: { type: integer, minimum: 1 }
        due_date: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, archived] }
    ComingSoon:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, const: coming_soon }
        reason: { type: string }
    LeakItem:
      type: object
      required: [category, amount, count, share]
      properties:
        category: { type: string }
        amount: { type: integer }
        count: { type: integer }
        share: { type: number, description: Доля от нецелевых трат, 0..1 }
    IntegrationKey:
      type: string
      enum: [cbu_rates, csv_xlsx, 1c_bank, commerceml, telegram_bot, public_api, webhooks, google_signin, google_sheets, payme, click, uzum_market, moysklad, billz, didox, faktura, kapitalbank, tbc, uzum_business, hamkorbank, voice_cfo_call]
      description: |
        Рабочие: cbu_rates, csv_xlsx, 1c_bank, commerceml, telegram_bot, public_api, webhooks; google_signin/google_sheets — только при GOOGLE_CLIENT_ID/SECRET (иначе needs_setup).
        coming_soon (без серверного кода): payme, click, uzum_market, moysklad, billz, didox, faktura, kapitalbank, tbc, uzum_business, hamkorbank, voice_cfo_call.
    IntegrationItem:
      type: object
      required: [key, name, category, status, logo_url, description, connection_id, action_url]
      properties:
        key: { $ref: '#/components/schemas/IntegrationKey' }
        name: { type: string }
        category: { type: string, enum: [rates, files, accounting, messaging, developer, auth, payments, marketplace, warehouse, e_invoice, bank, voice] }
        status: { type: string, enum: [connected, available, needs_setup, coming_soon] }
        logo_url: { type: string, description: Официальный логотип из web/public }
        description: { type: string }
        connection_id: { type: [integer, 'null'], description: Только для google_sheets }
        action_url: { type: [string, 'null'], description: 'Куда вести по кнопке: /app/imports, /api/auth/google/start/?purpose=sheets, t.me/<bot>, /app/settings/developer' }
    Connection:
      type: object
      required: [id, kind, status, label, last_sync_at, last_error, settings]
      properties:
        id: { type: integer }
        kind: { type: string, const: google_sheets }
        status: { type: string, enum: [active, error, disconnected] }
        label: { type: string }
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        settings: { type: object, additionalProperties: true, description: 'spreadsheet_id, account_id, sync_direction. Секреты никогда не возвращаются.' }
    ConnectionPatch:
      type: object
      properties:
        label: { type: string }
        settings: { type: object, additionalProperties: true }
    SyncRun:
      type: object
      required: [id, status, created, updated, skipped, started_at, finished_at, error]
      properties:
        id: { type: integer }
        status: { type: string, enum: [running, ok, error] }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
    ImportKind:
      type: string
      enum: [csv, xlsx, 1c_bank, commerceml]
    ColumnMapping:
      type: object
      description: Колонка файла → поле операции
      additionalProperties: { type: string, enum: [date, amount, inflow, outflow, direction, category, counterparty, note, account, currency, skip] }
    ImportPreviewRow:
      type: object
      required: [row, draft, duplicate, errors]
      properties:
        row: { type: integer }
        draft: { $ref: '#/components/schemas/OperationInput' }
        duplicate: { type: boolean, description: Совпадение дата+сумма+контрагент с существующей операцией }
        errors: { type: array, items: { type: string } }
    Import:
      type: object
      required: [id, kind, filename, status, mapping, mapping_confidence, columns, total_rows, preview, created_count]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/ImportKind' }
        filename: { type: string }
        status: { type: string, enum: [preview, committed, failed] }
        mapping: { $ref: '#/components/schemas/ColumnMapping' }
        mapping_confidence: { type: number, description: '0..1; AI-маппинг для csv/xlsx, 1.0 для известных форматов' }
        columns: { type: array, items: { type: string } }
        total_rows: { type: integer }
        preview: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ImportPreviewRow' } }
        created_count: { type: integer }
    NotificationSettings:
      type: object
      required: [daily_brief, daily_brief_time, gap_alerts, tax_reminders, weekly_digest, weekly_digest_weekday, timezone, telegram_connected]
      properties:
        daily_brief: { type: boolean }
        daily_brief_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '09:00' }
        gap_alerts: { type: boolean }
        tax_reminders: { type: boolean, description: Напоминания по подтверждённым TaxReminder с notify_telegram }
        weekly_digest: { type: boolean, description: Еженедельный текстовый дайджест в Telegram }
        weekly_digest_weekday: { type: integer, minimum: 0, maximum: 6, default: 0, description: 0 — понедельник }
        timezone: { type: string, default: Asia/Tashkent }
        telegram_connected: { type: boolean, readOnly: true }
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string, description: Первые 8 символов для опознания }
        scopes: { type: array, items: { type: string, enum: [read, write] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
    WebhookEvent: { type: string, enum: [transaction.created, gap.detected] }
    WebhookSubscription:
      type: object
      required: [id, url, events, active, created_at, last_delivery_status]
      properties:
        id: { type: integer }
        url: { type: string, format: uri, description: Только https }
        events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WebhookEvent' } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_delivery_status: { type: [integer, 'null'] }
    WebhookPayload:
      type: object
      description: |
        POST на url подписки. Заголовки: `X-Oydin-Event`, `X-Oydin-Delivery` (uuid), `X-Oydin-Timestamp` (unix),
        `X-Oydin-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + raw_body)>`. Ретраи 1м/10м/1ч при не-2xx, таймаут 5 с.
      required: [id, event, created_at, data]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/WebhookEvent' }
        created_at: { type: string, format: date-time }
        data:
          oneOf:
            - { $ref: '#/components/schemas/Operation' }
            - type: object
              required: [date, shortfall, obligation_id]
              properties: { date: { type: string, format: date }, shortfall: { type: integer }, obligation_id: { type: [integer, 'null'] } }
    SavedTool:
      type: object
      required: [id, title, ui, state, pinned, position, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        ui: { type: string, maxLength: 50000, description: OpenUI Lang исходник калькулятора/планировщика }
        state: { type: object, additionalProperties: true, description: Последние значения полей/слайдеров }
        pinned: { type: boolean, description: Показывать на дашборде }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedToolInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        ui: { type: string, maxLength: 50000 }
        state: { type: object, additionalProperties: true }
        pinned: { type: boolean }
        position: { type: integer }
    OcrResult:
      type: object
      required: [text, drafts]
      properties:
        text: { type: string, description: Распознанный текст чека/SMS }
        drafts: { type: array, items: { $ref: '#/components/schemas/OperationInput' }, description: Черновики; сохраняются только после подтверждения через POST /operations/ }
paths:
  /health/:
    get:
      security: []
      x-roles: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, db: { type: boolean }, ai: { type: boolean } }
        '503': { $ref: '#/components/responses/Error' }
  # ───────────── auth ─────────────
  /auth/csrf/:
    get:
      security: []
      x-roles: []
      responses:
        '200': { description: Ставит csrftoken cookie, content: { application/json: { schema: { type: object, properties: { csrftoken: { type: string } } } } } }
        '500': { $ref: '#/components/responses/Error' }
  /auth/providers/:
    get:
      security: []
      x-roles: []
      summary: Какие способы входа включены (по env)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [email, google, telegram, demo]
                properties: { email: { type: boolean }, google: { type: boolean }, telegram: { type: boolean }, demo: { type: boolean } }
  /auth/email/request/:
    post:
      security: []
      x-roles: []
      summary: Отправить 6-значный код на email (TTL 10 мин). Ответ одинаков для неизвестных email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email }, lang: { $ref: '#/components/schemas/Locale' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [ok, resend_in], properties: { ok: { type: boolean, const: true }, resend_in: { type: integer, example: 60 } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error', description: '{"error":"rate_limited"}' }
        '503': { $ref: '#/components/responses/Error', description: '{"error":"email_not_configured"}' }
  /auth/email/verify/:
    post:
      security: []
      x-roles: []
      summary: Проверить код → сессия. Первый вход создаёт пользователя и привязывает приглашения на этот email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, code], properties: { email: { type: string, format: email }, code: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error', description: '{"error":"invalid_code"}' }
        '429': { $ref: '#/components/responses/Error', description: После 5 неверных попыток }
  /auth/demo/:
    post:
      security: []
      x-roles: []
      summary: Вход в демо-бизнес (только при DEMO_LOGIN=1)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /auth/telegram/:
    post:
      security: []
      x-roles: []
      summary: Вход из Telegram Mini App; HMAC-проверка initData ботовым токеном, auth_date не старше 24ч
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [init_data], properties: { init_data: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/telegram/widget/:
    post:
      security: []
      x-roles: []
      summary: Вход через Telegram Login Widget на вебе; hash = HMAC-SHA256(SHA256(bot_token), data_check_string), auth_date ≤ 24ч
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, auth_date, hash]
              properties:
                id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
