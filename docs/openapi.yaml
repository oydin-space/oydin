  # ---------- Beginner ----------
  /beginner/plan/:
    get:
      summary: 'План старта — бюджет, безубыточность, чек-лист, форма регистрации и справочник'
      description: Язык справочника — `?lang=`, затем `Accept-Language` (ru|uz|en)
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BeginnerPlan' } } } }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: Сохранить части плана
      description: 403 `demo_tenant` в демо-бизнесе; 400 с русским текстом при невалидных `budget_items` / `breakeven` / `checklist` / `regime`
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BeginnerPlanInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BeginnerPlan' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /beginner/plan/pdf/:
    get:
      summary: План старта в PDF
      description: 'Файл `oydin-start-plan.pdf`; язык — `?lang=` / `Accept-Language`'
      x-roles: [owner, accountant]
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Error' }
  # ---------- Owner money split ----------
  /planning/afford/:
    post:
      summary: Алиас `/decisions/afford/` — «Могу ли я позволить?»
      description: 400 «Дата не дальше 90 дней»; 503 `no_rate`
      x-roles: [owner, accountant]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AffordInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AffordResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /planning/split/:
    get:
      summary: Деньги владельца — сколько можно вывести и вложить в развитие после обязательств на 30 дней
      description: 503 `no_rate`
      x-roles: [owner, accountant]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSplit' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Сохранить доли «развитию» / «себе» и вернуть пересчитанный расчёт
      description: 'Только owner (accountant → 403 `forbidden`); 403 `demo_tenant` в демо-бизнесе; 400 если доли не целые 0…100 или не в сумме 100; 503 `no_rate`'
      x-roles: [owner]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSplitInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSplit' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /planning/today/:
    get:
      summary: «Сколько можно забрать или потратить сегодня, чтобы к дате хватило на зарплату и аренду?»
      description: 'Язык названий средних — `?lang=` / `Accept-Language`. 400 `{error: invalid_until}` — `until` не дата или не в (сегодня, сегодня+90]; 401 без сессии; seller → 403 `forbidden`; 503 `rates_unavailable` (нет курса для валютного счёта)'
      x-roles: [owner, accountant]
      parameters:
        - { name: until, in: query, schema: { type: string, format: date }, description: 'По умолчанию — срок ближайшей зарплаты/аренды, иначе пятница' }
        - { $ref: '#/components/parameters/Lang' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TodayAnswer' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
