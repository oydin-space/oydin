openapi: 3.1.0
info:
  title: Oydin API
  version: 0.2.0
  description: |
    Второй мозг для малого бизнеса. Все суммы — целые UZS (int), даты — ISO 8601 (YYYY-MM-DD).
    Ошибки: `{"error": "..."}`. Пути заканчиваются на `/`. Аутентификация — Django session cookie
    (`sessionid`) для веба; Telegram Mini App получает тот же session через `POST /api/auth/telegram/`.
    Мутирующие запросы с cookie требуют `X-CSRFToken` (получить через `GET /api/auth/csrf/`).
    Роли в бизнесе: owner (всё), accountant (операции, импорт/экспорт, отчёты; без команды, интеграций и токенов),
    seller (создаёт операции; видит только свои операции и пульс). Недостаточно прав → 403.
    Язык ответов AI и уведомлений берётся из `User.locale` (fallback `Business.locale`).
    Публичный API — `/api/v1/` с `Authorization: Bearer oyd_…` (без CSRF и cookie).
servers:
  - url: /api
security:
  - session: []
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sessionid }
    bearer: { type: http, scheme: bearer, description: 'Персональный токен `oyd_<base62>`; в БД хранится только SHA-256' }
    telegramSecret: { type: apiKey, in: header, name: X-Telegram-Bot-Api-Secret-Token }
  responses:
    Error:
      description: Ошибка (400 валидация, 401 нет сессии/токена, 403 нет прав, 404 не найдено, 409 конфликт, 413 файл велик, 429 лимит, 502 внешний сервис)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Tone:
      type: string
      enum: [calm, watch, risk]
      description: calm — всё хорошо, watch — обратить внимание, risk — нужен шаг сейчас
    Locale: { type: string, enum: [ru, uz, en], description: 'uz — латиница' }
    Role: { type: string, enum: [owner, accountant, seller] }
    Permission:
      type: string
      enum: [transactions.read_all, transactions.write, reports.read, imports.manage, exports.read, team.manage, integrations.manage, tokens.manage, settings.manage]
      description: |
        owner — все; accountant — transactions.read_all, transactions.write, reports.read, imports.manage, exports.read;
        seller — transactions.write.
    User:
      type: object
      required: [id, name, business, locale, role, permissions, consent_version]
      properties:
        id: { type: integer }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        consent_version: { type: [string, 'null'], description: 'Принятая версия юр. документов; null или < актуальной → consent screen' }
        email: { type: [string, 'null'] }
        telegram_linked: { type: boolean }
        google_linked: { type: boolean }
        business: { $ref: '#/components/schemas/Business' }
    Business:
      type: object
      required: [id, name, industry, city, tax_regime, locale, segment, plan]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        tax_regime:
          type: string
          enum: [unknown, turnover, simplified_vat, general]
        locale: { $ref: '#/components/schemas/Locale' }
        segment: { $ref: '#/components/schemas/Segment' }
        plan: { type: string, enum: [free, pro], description: Биллинга нет; pro выдаётся вручную по заявке доступа }
    Segment: { type: string, enum: [textile_print, retail, horeca, marketplace_seller, services] }
    Pulse:
      type: object
      required: [score, tone, headline, balance, safe_to_spend, runway_days, promises, gap, metrics]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, description: Индекс живучести }
        tone: { $ref: '#/components/schemas/Tone' }
        headline: { type: string, description: 'Одна фраза, напр. "Зарплату 10-го закроете спокойно"' }
        balance: { type: integer }
        safe_to_spend: { type: integer, description: Можно потратить сегодня, не задев обязательства и конверты }
        runway_days: { type: integer }
        promises:
          type: object
          required: [kept, total]
          properties: { kept: { type: integer }, total: { type: integer } }
        gap:
          description: Ближайший кассовый разрыв в горизонте 30 дней или null
          oneOf:
            - type: 'null'
            - type: object
              required: [date, amount, reason]
              properties:
                date: { type: string, format: date }
                amount: { type: integer }
                reason: { type: string }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
    Metric:
      type: object
      required: [key, label, value, unit, tone, hint]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [sum, pct, days, count] }
        tone: { $ref: '#/components/schemas/Tone' }
        hint: { type: string }
        trend:
          type: array
          items: { type: number }
    Insight:
      type: object
      required: [id, kind, title, body, tone, source, as_of, confidence]
      properties:
        id: { type: string }
        kind: { type: string, enum: [market, local, tax, own] }
        title: { type: string }
        body: { type: string }
        tone: { $ref: '#/components/schemas/Tone' }
        source: { type: string }
        source_url: { type: [string, 'null'] }
        as_of: { type: string, format: date }
        confidence: { type: string, enum: [high, medium, low] }
        action: { type: [string, 'null'], description: Вопрос для чата по клику }
    Account:
      type: object
      required: [id, name, kind, balance]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [cash, card, bank] }
        balance: { type: integer }
    Transaction:
      type: object
      required: [id, date, amount, direction, category, purpose, account_id, note, status, source]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        amount: { type: integer, minimum: 1 }
        direction: { type: string, enum: [in, out, transfer] }
        category: { type: string }
        purpose:
          type: string
          enum: [business, personal, unclear]
          description: целевая (business) / нецелевая (personal) трата
        account_id: { type: integer }
        counterparty: { type: [string, 'null'] }
        note: { type: string }
        status: { type: string, enum: [draft, confirmed] }
        source: { type: string, enum: [manual, voice, chat, import, seed, integration, ocr, telegram, api] }
    TransactionInput:
      type: object
      required: [amount, direction, category, account_id]
      properties:
        date: { type: string, format: date }
        amount: { type: integer, minimum: 1 }
        direction: { type: string, enum: [in, out, transfer] }
        category: { type: string }
        purpose: { type: string, enum: [business, personal, unclear] }
        account_id: { type: integer }
        counterparty: { type: [string, 'null'] }
        note: { type: string }
    Obligation:
      type: object
      required: [id, title, kind, amount, due_date, status, covered]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [salary, rent, tax, supplier, loan, other, receivable] }
        amount: { type: integer }
        due_date: { type: string, format: date }
        status: { type: string, enum: [planned, paid, overdue] }
        covered: { type: boolean, description: Хватает ли прогнозного остатка на дату }
    Envelope:
      type: object
      required: [id, title, target, saved, due_date, daily]
      properties:
        id: { type: integer }
        title: { type: string }
        target: { type: integer }
        saved: { type: integer }
        due_date: { type: string, format: date }
        daily: { type: integer, description: Сколько откладывать в день }
    ForecastPoint:
      type: object
      required: [date, balance, inflow, outflow, seasonality]
      properties:
        date: { type: string, format: date }
        balance: { type: integer }
        inflow: { type: integer }
        outflow: { type: integer }
        seasonality: { type: number, description: 'Множитель выручки на дату (1.0 — норма) из локального календаря сегмента' }
        event: { type: [string, 'null'], description: 'Напр. "Навруз", "1 сентября", "Рамадан"' }
    Product:
      type: object
      required: [id, name, price, unit_cost, margin_pct, markup_pct, cost_is_estimate]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: integer }
        unit_cost: { type: integer }
        margin_pct: { type: number }
        markup_pct: { type: number }
        cost_is_estimate: { type: boolean }
    Order:
      type: object
      required: [id, client, channel, total, prepaid, status, due_date, items]
      properties:
        id: { type: integer }
        client: { type: string }
        channel: { type: string, enum: [retail, showroom, b2b, online] }
        total: { type: integer }
        prepaid: { type: integer }
        status: { type: string, enum: [brief, sample, production, qc, delivered, paid] }
        due_date: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [product_id, qty, price]
            properties:
              product_id: { type: integer }
              qty: { type: integer }
              price: { type: integer }
    Chart:
      type: object
      required: [type, title, unit, data]
      properties:
        type: { type: string, enum: [bar, line, area, pie] }
        title: { type: string }
        unit: { type: string }
        data:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [label, value]
            properties: { label: { type: string }, value: { type: number } }
    AiReply:
      type: object
      required: [reply, suggestions, trace_id, ui]
      properties:
        reply: { type: string, description: Markdown на языке пользователя }
        suggestions: { type: array, items: { type: string }, maxItems: 4 }
        chart: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Chart' }] }
        ui:
          type: [string, 'null']
          maxLength: 50000
          description: OpenUI Lang — генеративный интерфейс (графики, таблицы, слайдеры сценариев, калькуляторы) на компонентах Oydin; можно закрепить через POST /tools/.
        draft:
          description: Предложенная операция — сохраняется только после подтверждения пользователем
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TransactionInput' }]
        trace_id: { type: [string, 'null'] }
        fallback: { type: boolean }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    Member:
      type: object
      required: [id, user_id, name, role, joined_at]
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, role, token, url, telegram_url, expires_at, status]
      properties:
        id: { type: integer }
        role: { $ref: '#/components/schemas/Role' }
        token: { type: string }
        url: { type: string, description: 'https://oydin.sayfi.uz/join/<token>' }
        telegram_url: { type: string, description: 't.me/<bot>?start=join_<token>' }
        expires_at: { type: string, format: date-time, description: 7 дней }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
    Goal:
      type: object
      required: [id, kind, title, target, current, due_date, streak_days, best_streak, status]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [safety_cushion, savings, revenue, expense_cap, no_personal_leaks] }
        title: { type: string }
        target: { type: integer, description: 'UZS (для safety_cushion — дни запаса × средний дневной расход)' }
        current: { type: integer }
        due_date: { type: [string, 'null'], format: date }
        streak_days: { type: integer, description: Дней подряд с выполненным дневным шагом }
        best_streak: { type: integer }
        status: { type: string, enum: [active, achieved, archived] }
    GoalInput:
      type: object
      required: [kind, title, target]
      properties:
        kind: { type: string, enum: [safety_cushion, savings, revenue, expense_cap, no_personal_leaks] }
        title: { type: string, maxLength: 120 }
        target: { type: integer, minimum: 1 }
        due_date: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, archived] }
    Benchmark:
      type: object
      required: [metric, label, value, peer_p25, peer_median, peer_p75, peers, source, tone]
      properties:
        metric: { type: string, enum: [margin_pct, rent_share, payroll_share, personal_share, runway_days, receivables_days] }
        label: { type: string }
        value: { type: number }
        peer_p25: { type: number }
        peer_median: { type: number }
        peer_p75: { type: number }
        peers: { type: integer, description: 'Размер анонимной когорты (сегмент+город); k-анонимность ≥ 5, иначе source=public_stats' }
        source: { type: string, enum: [peers, public_stats] }
        tone: { $ref: '#/components/schemas/Tone' }
    LeakItem:
      type: object
      required: [category, amount, count, share]
      properties:
        category: { type: string }
        amount: { type: integer }
        count: { type: integer }
        share: { type: number, description: Доля от нецелевых трат, 0..1 }
    IntegrationKind:
      type: string
      enum: [google_sheets, payme, click, uzum_market, moysklad, billz, didox, faktura]
    Connection:
      type: object
      required: [id, kind, status, label, last_sync_at, last_error, settings]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/IntegrationKind' }
        status: { type: string, enum: [active, error, disconnected] }
        label: { type: string }
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        settings: { type: object, additionalProperties: true, description: 'Нечувствительные настройки (spreadsheet_id, account_id, sync_direction). Секреты никогда не возвращаются.' }
    ConnectionInput:
      type: object
      required: [kind, credentials]
      properties:
        kind: { $ref: '#/components/schemas/IntegrationKind' }
        label: { type: string }
        credentials:
          type: object
          additionalProperties: { type: string }
          description: |
            Шифруются Fernet (INTEGRATIONS_FERNET_KEY) до записи. По kind:
            payme {merchant_id, key}; click {service_id, merchant_user_id, secret_key}; uzum_market {api_token, shop_id};
            moysklad {token}; billz {secret_token}; didox {login, password, tin}; faktura {login, password, tin}.
            google_sheets создаётся только через GET /auth/google/start/?purpose=sheets (POST → 400).
        settings: { type: object, additionalProperties: true }
    ConnectionPatch:
      type: object
      properties:
        label: { type: string }
        credentials: { type: object, additionalProperties: { type: string } }
        settings: { type: object, additionalProperties: true }
    SyncRun:
      type: object
      required: [id, status, created, updated, skipped, started_at, finished_at, error]
      properties:
        id: { type: integer }
        status: { type: string, enum: [running, ok, error] }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
    ImportKind:
      type: string
      enum: [csv, xlsx, 1c_bank, commerceml, kapitalbank, tbc, uzum_business, hamkorbank]
    ColumnMapping:
      type: object
      description: Колонка файла → поле операции
      additionalProperties: { type: string, enum: [date, amount, inflow, outflow, direction, category, counterparty, note, account, skip] }
    ImportPreviewRow:
      type: object
      required: [row, draft, duplicate, errors]
      properties:
        row: { type: integer }
        draft: { $ref: '#/components/schemas/TransactionInput' }
        duplicate: { type: boolean, description: Совпадение дата+сумма+контрагент с существующей операцией }
        errors: { type: array, items: { type: string } }
    Import:
      type: object
      required: [id, kind, filename, status, mapping, mapping_confidence, columns, total_rows, preview, created_count]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/ImportKind' }
        filename: { type: string }
        status: { type: string, enum: [preview, committed, failed] }
        mapping: { $ref: '#/components/schemas/ColumnMapping' }
        mapping_confidence: { type: number, description: '0..1; AI-маппинг для csv/xlsx, 1.0 для известных форматов' }
        columns: { type: array, items: { type: string } }
        total_rows: { type: integer }
        preview: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ImportPreviewRow' } }
        created_count: { type: integer }
    NotificationSettings:
      type: object
      required: [daily_brief, daily_brief_time, gap_alerts, weekly_cfo_call, weekly_cfo_weekday, timezone, telegram_connected]
      properties:
        daily_brief: { type: boolean }
        daily_brief_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '09:00' }
        gap_alerts: { type: boolean }
        weekly_cfo_call: { type: boolean, description: 'Голосовая (TTS) сводка ~2 мин в Telegram' }
        weekly_cfo_weekday: { type: integer, minimum: 0, maximum: 6, default: 0, description: 0 — понедельник }
        timezone: { type: string, default: Asia/Tashkent }
        telegram_connected: { type: boolean, readOnly: true }
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string, description: Первые 8 символов для опознания }
        scopes: { type: array, items: { type: string, enum: [read, write] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
    WebhookEvent: { type: string, enum: [transaction.created, gap.detected] }
    WebhookSubscription:
      type: object
      required: [id, url, events, active, created_at, last_delivery_status]
      properties:
        id: { type: integer }
        url: { type: string, format: uri, description: Только https }
        events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WebhookEvent' } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_delivery_status: { type: [integer, 'null'] }
    WebhookPayload:
      type: object
      description: |
        POST на url подписки. Заголовки: `X-Oydin-Event`, `X-Oydin-Delivery` (uuid), `X-Oydin-Timestamp` (unix),
        `X-Oydin-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + raw_body)>`. Ретраи 1м/10м/1ч при не-2xx, таймаут 5 с.
      required: [id, event, created_at, data]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/WebhookEvent' }
        created_at: { type: string, format: date-time }
        data:
          oneOf:
            - { $ref: '#/components/schemas/Transaction' }
            - type: object
              required: [date, shortfall, obligation_id]
              properties: { date: { type: string, format: date }, shortfall: { type: integer }, obligation_id: { type: [integer, 'null'] } }
    SavedTool:
      type: object
      required: [id, title, ui, state, pinned, position, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        ui: { type: string, maxLength: 50000, description: OpenUI Lang исходник калькулятора/планировщика }
        state: { type: object, additionalProperties: true, description: Последние значения полей/слайдеров }
        pinned: { type: boolean, description: Показывать на дашборде }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedToolInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        ui: { type: string, maxLength: 50000 }
        state: { type: object, additionalProperties: true }
        pinned: { type: boolean }
        position: { type: integer }
    OcrResult:
      type: object
      required: [text, drafts]
      properties:
        text: { type: string, description: Распознанный текст чека/SMS }
        drafts: { type: array, items: { $ref: '#/components/schemas/TransactionInput' }, description: Черновики; сохраняются только после подтверждения через POST /transactions/ }
paths:
  /health/:
    get:
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, db: { type: boolean }, ai: { type: boolean } }
        '503': { $ref: '#/components/responses/Error' }
  /auth/csrf/:
    get:
      security: []
      responses:
        '200': { description: Ставит csrftoken cookie, content: { application/json: { schema: { type: object, properties: { csrftoken: { type: string } } } } } }
        '500': { $ref: '#/components/responses/Error' }
  /auth/demo/:
    post:
      security: []
      summary: Вход в демо-бизнес Print Lab (только при DEMO_LOGIN=1)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /auth/telegram/:
    post:
      security: []
      summary: Вход из Telegram Mini App; HMAC-проверка initData ботовым токеном, auth_date не старше 24ч
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [init_data], properties: { init_data: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout/:
    post:
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /me/:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      summary: Профиль пользователя (язык интерфейса и AI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string, maxLength: 80 }, locale: { $ref: '#/components/schemas/Locale' } } }
