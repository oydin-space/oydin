openapi: 3.1.0
info:
  title: Oydin API
  version: 0.4.1
  description: |
    Второй мозг для малого бизнеса. Даты — ISO 8601 (YYYY-MM-DD). Ошибки: `{"error": "<код или текст>"}` (часть ошибок валидации — русский текст). Пути заканчиваются на `/`.
    Неверный метод → 405, нет сессии → 401, тело не JSON-объект → 400.

    **Деньги.** Суммы — целые числа в минимальной единице валюты счёта (UZS — сум, USD — центы). `Account.currency` ∈ UZS|USD.
    Все итоги (пульс, прогноз, отчёты, afford, impact) — в UZS по последнему сохранённому курсу ЦБ (`GET /rates/`, источник cbu.uz).

    **Аутентификация.** Django session cookie (`sessionid`); вход — email-код, Google OAuth, Telegram Mini App, демо.
    Мутирующие запросы с cookie требуют `X-CSRFToken` (`GET /auth/csrf/`). Публичный API — `/v1/` с `Authorization: Bearer oyd_…`.

    **Тенантность.** Тенант — `Business`. Доступ — через `Membership(user, business, role)`; пользователь может состоять в нескольких бизнесах.
    Бизнес-эндпоинты работают в контексте **активного** бизнеса (`Me.active_business_id`, переключается `POST /businesses/{id}/switch/`).
    Нет членства → `needs_onboarding: true`, бизнес-эндпоинты → 403 `{"error":"no_business"}`.

    **Роли.** `x-roles` на каждой операции — какие роли активного бизнеса могут её вызвать; `[]` — роль не нужна (публичный эндпоинт,
    любой вошедший пользователь или Bearer-токен, см. `security`). Чужая роль → 403 `{"error":"forbidden"}`.
    - owner — всё;
    - accountant — читает и пишет финансы (операции, обязательства, сверка кассы, налоговый резерв/напоминания, импорт/экспорт, должники, обязательства-повторы, инструменты); без команды, настроек, токенов, ссылок доступа и согласий;
    - seller — создаёт операции и видит только свои; без остатков (`balance*` опускаются), прогноза, отчётов и AI.

    **Язык.** Текстовые эндпоинты планирования (afford, напоминания должникам) берут `lang` из тела, затем `?lang=`, затем `Accept-Language` (ru|uz|en).

    **Согласия.** Все `/ai/*` требуют согласие `ai` (`PUT /consents/`) → иначе 403 `ai_consent_required`; продавцу — 403 `forbidden`.

    ## Changelog 0.4.0
    Приведено в соответствие с реализацией (`backend/*/urls.py`). Источник истины — код бэкенда.
    - Добавлено: `POST /accounts/`, `PATCH|DELETE /accounts/{id}/`; `to_account_id` и `status` в `PATCH /transactions/{id}/`;
      `Pulse.tax_reserved`, `Pulse.cash_difference`; `cash_close` в `/sync/`; события вебхуков `transaction.confirmed`, `gap.detected`;
      планирование (`/seasonality/`, `/debtors/`, `/debtors/reminders/*`, `/commitments/*`); `/tools/*`, `/tools/templates/`, `/ai/tools/generate/`,
      поле `ui` в `/ai/chat/`; Telegram (`/telegram/*`, `/notifications/settings/`); сегмент `marketplace_seller`; `tax_regime`.
    - `POST /v1/transactions/` по умолчанию создаёт черновик (`status: draft`).
    - Импорт: лимит файла 5 МБ; commit создаёт **черновики** (`source: import`).
    - Ссылки доступа: 404 неизвестная, 410 `expired` / `revoked`; `url` возвращается только при создании.
    - Afford: вердикты yes/risky/no, поля `recurring`, `assumptions`.
    - Удалено (нет в бэкенде): `/operations/*` (вместо них `/transactions/*`), `/onboarding/`, `/reports/leaks/`,
      `/legal/consent/`, `/pricing/access-request/`, `/integrations/*`, `/ocr/`, `/notifications/test/`, `/digest/weekly/`.
servers:
  - url: /api
security:
  - session: []
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sessionid }
    bearer: { type: http, scheme: bearer, description: 'Персональный токен `oyd_<base62>`; в БД хранится только SHA-256' }
    telegramSecret: { type: apiKey, in: header, name: X-Telegram-Bot-Api-Secret-Token }
  responses:
    Error:
      description: Ошибка (400 валидация, 401 нет сессии/токена, 403 нет прав, 404 не найдено, 405 метод, 409 конфликт, 410 истекло/отозвано, 413 файл велик, 415 тип, 429 лимит, 502 внешний сервис, 503 не настроено)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent: { description: Готово, без тела }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    BusinessId: { name: business_id, in: path, required: true, schema: { type: integer } }
    MemberId: { name: member_id, in: path, required: true, schema: { type: integer } }
    Token: { name: token, in: path, required: true, schema: { type: string }, description: Токен ссылки доступа }
    PartnerId: { name: partner_id, in: path, required: true, schema: { type: integer } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 80 }, description: 'Повтор с тем же ключом и телом возвращает первый ответ; с другим телом → 409 {"error":"idempotency_conflict"}' }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    Lang: { name: lang, in: query, schema: { $ref: '#/components/schemas/Locale' } }
  schemas:
    Connector:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [mcp, rest] }
        name: { type: string }
        description: { type: string }
        url: { type: string, description: 'MCP: адрес сервера; REST: шаблон с {param}' }
        method: { type: string, enum: ['', GET, POST, PUT, PATCH, DELETE] }
        params_schema: { type: object, additionalProperties: true }
        auth_header: { type: string }
        has_secret: { type: boolean }
        tools: { type: array, items: { type: object, properties: { name: { type: string }, description: { type: string } } } }
        enabled: { type: boolean }
        last_test_ok: { type: [boolean, 'null'] }
        last_test_error: { type: string }
        last_test_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ConnectorInput:
      type: object
      properties:
        kind: { type: string, enum: [mcp, rest], description: только при создании }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 500, description: 'обязательно для REST' }
        url: { type: string, maxLength: 500 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        params_schema: { type: object, additionalProperties: true, description: 'JSON Schema type=object; каждый {плейсхолдер} URL — в properties' }
        auth_header: { type: string, maxLength: 60 }
        auth_secret: { type: string, writeOnly: true, description: Значение заголовка; шифруется, обратно не отдаётся }
        enabled: { type: boolean }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    Tone: { type: string, enum: [calm, watch, risk] }
    Locale: { type: string, enum: [ru, uz, en] }
    Role: { type: string, enum: [owner, accountant, seller] }
    Currency: { type: string, enum: [UZS, USD] }
    Segment: { type: string, enum: [textile_print, retail, horeca, marketplace_seller, services, other, ''] }
    TaxRegime: { type: string, enum: [unknown, turnover, simplified_vat, general] }
    Business:
      type: object
      required: [id, name, industry, city, segment, tax_regime]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        segment: { $ref: '#/components/schemas/Segment' }
        tax_regime: { $ref: '#/components/schemas/TaxRegime' }
    BusinessItem:
      type: object
      required: [id, name, industry, city, segment, role, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        segment: { $ref: '#/components/schemas/Segment' }
        role: { $ref: '#/components/schemas/Role' }
        is_demo: { type: boolean }
    BusinessRef:
      type: object
      required: [id, name, role, is_demo, segment]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_demo: { type: boolean }
        segment: { $ref: '#/components/schemas/Segment' }
    BusinessInput:
      type: object
      properties:
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        segment: { $ref: '#/components/schemas/Segment' }
    Me:
      type: object
      required: [id, name, email, is_staff, role, active_business_id, needs_onboarding, business, businesses]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, 'null'] }
        is_staff: { type: boolean }
        role: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Role' }], description: Роль в активном бизнесе }
        active_business_id: { type: [integer, 'null'] }
        needs_onboarding: { type: boolean, description: true — нет ни одного членства }
        business: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Business' }] }
        businesses: { type: array, items: { $ref: '#/components/schemas/BusinessRef' } }
    Invite:
      type: object
      required: [id, code, role, expires_at, max_uses, uses, status, created_at]
      properties:
        id: { type: integer }
        code: { type: string, description: 'Секрет ссылки /join/{code}' }
        role: { type: string, enum: [accountant, seller] }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer }
        uses: { type: integer }
        status: { type: string, enum: [active, expired, revoked, used_up] }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, user_id, name, email, role, pending, created_at]
      properties:
        id: { type: integer, description: Membership id }
        user_id: { type: [integer, 'null'], description: null — приглашение не принято }
        name: { type: string }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        pending: { type: boolean }
        created_at: { type: string, format: date-time }
    Rates:
      type: object
      required: [date, USD, source, stale]
      properties:
        date: { type: string, format: date }
        USD: { type: string, description: 'UZS за 1 USD, десятичная строка', example: '12010.45' }
        source: { type: string, example: cbu.uz }
        stale: { type: boolean }
    Metric:
      type: object
      required: [key, label, value, unit, tone, hint]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string, enum: [sum, pct, days, count] }
        tone: { $ref: '#/components/schemas/Tone' }
        hint: { type: string }
        trend: { type: array, items: { type: number } }
    Pulse:
      type: object
      required: [score, tone, headline, balance, safe_to_spend, runway_days, promises, gap, tax_reserved, cash_difference, metrics]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        tone: { $ref: '#/components/schemas/Tone' }
        headline: { type: string }
        balance: { type: integer, description: UZS }
        safe_to_spend: { type: integer, description: 'Можно потратить сегодня; уменьшен на tax_reserved' }
        runway_days: { type: integer }
        promises:
          type: object
          required: [kept, total]
          properties: { kept: { type: integer }, total: { type: integer } }
        gap:
          description: Ближайший кассовый разрыв или null
          oneOf:
            - { type: 'null' }
            - type: object
              required: [date, amount, reason]
              properties:
                date: { type: string, format: date }
                amount: { type: integer }
                reason: { type: string }
        tax_reserved: { type: integer, description: Плановый налоговый резерв (UZS), уже вычтен из safe_to_spend }
        cash_difference: { type: integer, description: Необъяснённая разница последней сверки кассы (UZS) }
        metrics: { type: array, items: { $ref: '#/components/schemas/Metric' } }
    Insight:
      type: object
      required: [id, kind, title, body, tone, source, source_url, as_of, confidence, action]
      properties:
        id: { type: string }
        kind: { type: string, enum: [market, local, tax, own] }
        title: { type: string }
        body: { type: string }
        tone: { $ref: '#/components/schemas/Tone' }
        source: { type: string }
        source_url: { type: [string, 'null'] }
        as_of: { type: string, format: date }
        confidence: { type: string, enum: [high, medium, low] }
        action: { type: [string, 'null'], description: Вопрос для чата }
    Account:
      type: object
      required: [id, name, kind, currency]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [cash, card, bank] }
        currency: { $ref: '#/components/schemas/Currency' }
        balance: { type: integer, description: В минимальной единице валюты счёта; для seller поле опущено }
        balance_uzs: { type: integer, description: Пересчёт по курсу; для seller поле опущено }
    AccountCreate:
      type: object
      required: [name, kind, currency]
      properties:
        name: { type: string, maxLength: 100, description: 'Уникально в бизнесе (400 account_exists)' }
        kind: { type: string, enum: [cash, card, bank] }
        currency: { $ref: '#/components/schemas/Currency' }
        opening_balance: { type: integer, minimum: 0, maximum: 10000000000000, default: 0 }
    Purpose: { type: string, enum: [business, personal, unclear, owner_draw, owner_contribution], description: 'owner_draw / owner_contribution — изъятие / вложение владельца; недоступны seller' }
    TransactionSource: { type: string, enum: [manual, voice, chat, import, seed, api, offline] }
    Transaction:
      type: object
      required: [id, date, amount, direction, category, purpose, account_id, counterparty, note, status, source, to_account_id]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        amount: { type: integer, minimum: 1 }
        direction: { type: string, enum: [in, out, transfer] }
        category: { type: string }
        purpose: { $ref: '#/components/schemas/Purpose' }
        account_id: { type: integer }
        counterparty: { type: [string, 'null'] }
        note: { type: string }
        status: { type: string, enum: [draft, confirmed] }
        source: { $ref: '#/components/schemas/TransactionSource' }
        to_account_id: { type: [integer, 'null'], description: Счёт-получатель для direction=transfer }
    TransactionInput:
      type: object
      required: [amount, direction, category, account_id]
      properties:
        date: { type: string, format: date, description: По умолчанию сегодня }
        amount: { type: integer, minimum: 1, maximum: 10000000000000 }
        direction: { type: string, enum: [in, out, transfer] }
        category: { type: string, maxLength: 100 }
        purpose: { $ref: '#/components/schemas/Purpose' }
        account_id: { type: integer }
        to_account_id: { type: [integer, 'null'] }
        counterparty: { type: [string, 'null'], maxLength: 200 }
        note: { type: string }
    TransactionPatch:
      description: Любое подмножество TransactionInput плюс status (draft → confirmed создаёт событие transaction.confirmed)
      allOf:
        - { $ref: '#/components/schemas/TransactionInput' }
        - type: object
          properties:
            status: { type: string, enum: [draft, confirmed] }
      required: []
    Obligation:
      type: object
      required: [id, title, kind, amount, due_date, status, covered]
      properties:
        id: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [salary, rent, tax, supplier, loan, other, receivable] }
        amount: { type: integer, description: UZS }
        due_date: { type: string, format: date }
        status: { type: string, enum: [planned, paid, overdue] }
        covered: { type: boolean }
    ObligationInput:
      type: object
      required: [title, kind, amount, due_date]
      properties:
        title: { type: string }
        kind: { type: string, enum: [salary, rent, tax, supplier, loan, other, receivable] }
        amount: { type: integer, minimum: 1 }
        due_date: { type: string, format: date }
    Envelope:
      type: object
      required: [id, title, target, saved, due_date, daily]
      properties:
        id: { type: integer }
        title: { type: string }
        target: { type: integer }
        saved: { type: integer }
        due_date: { type: string, format: date }
        daily: { type: integer, description: Сколько откладывать в день }
    ForecastPoint:
      type: object
      required: [date, balance, inflow, outflow]
      properties:
        date: { type: string, format: date }
        balance: { type: integer }
        inflow: { type: integer }
        outflow: { type: integer }
    Product:
      type: object
      required: [id, name, price, cost_is_estimate]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: integer }
        unit_cost: { type: integer, description: Для seller опущено }
        margin_pct: { type: number, description: Для seller опущено }
        markup_pct: { type: number, description: Для seller опущено }
        cost_is_estimate: { type: boolean }
    Order:
      type: object
      required: [id, client, channel, total, prepaid, status, due_date, items]
      properties:
        id: { type: integer }
        client: { type: string }
        channel: { type: string, enum: [retail, showroom, b2b, online] }
        total: { type: integer }
        prepaid: { type: integer }
        status: { type: string, enum: [brief, sample, production, qc, delivered, paid] }
        due_date: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [product_id, qty, price]
            properties: { product_id: { type: integer }, qty: { type: integer }, price: { type: integer } }
    AnalyticsSummary:
      type: object
      required: [revenue, expenses, profit, personal_share, owner_draws, owner_contributions, cash_flow, by_category, by_week]
      properties:
        revenue: { type: integer }
        expenses: { type: integer }
        profit: { type: integer }
        personal_share: { type: number }
        owner_draws: { type: integer }
        owner_contributions: { type: integer }
        cash_flow: { type: integer }
        by_category:
          type: array
          items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: integer } } }
        by_week:
          type: array
          items:
            type: object
            required: [label, inflow, outflow]
            properties: { label: { type: string }, inflow: { type: integer }, outflow: { type: integer } }
    Chart:
      type: object
      required: [type, title, unit, data]
      properties:
        type: { type: string, enum: [bar, line, area, pie] }
        title: { type: string }
        unit: { type: string }
        data:
          type: array
          items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: number } } }
    MemoryFact:
      type: object
      required: [id, scope, text, source, created_at, updated_at]
      properties:
        id: { type: integer }
        scope: { type: string, enum: [business, user] }
        text: { type: string, maxLength: 300 }
        source: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AiReply:
      type: object
      required: [reply, suggestions, chart, draft, trace_id, fallback]
      properties:
        reply: { type: string }
        suggestions: { type: array, items: { type: string }, maxItems: 4 }
        chart: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Chart' }] }
        draft: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Transaction' }], description: Предложенный черновик операции }
        ui: { type: string, description: 'OpenUI Lang — генеративный интерфейс; присутствует только если прошёл валидацию. Можно сохранить через POST /tools/' }
        trace_id: { type: [string, 'null'] }
        fallback: { type: boolean }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, maxLength: 4000 }
    ToolKind: { type: string, enum: [what_if_gap, unit_cost, break_even, payroll, loan, envelope_plan_fact, receivables_aging, custom] }
    GeneratedTool:
      type: object
      required: [title, kind, spec]
      properties:
        title: { type: string }
        kind: { $ref: '#/components/schemas/ToolKind' }
        spec: { type: string, description: OpenUI Lang (строка); обязательно содержит Calculator }
    SavedTool:
      type: object
      required: [id, title, kind, spec, pinned, values, created_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 120 }
        kind: { $ref: '#/components/schemas/ToolKind' }
        spec: { type: string, maxLength: 65536, description: OpenUI Lang; должен содержать Calculator }
        pinned: { type: boolean }
        values: { type: object, additionalProperties: { type: number }, description: Последние значения полей }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedToolInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        kind: { $ref: '#/components/schemas/ToolKind' }
        spec: { type: string, maxLength: 65536 }
        pinned: { type: boolean }
        values: { type: object, additionalProperties: { type: number } }
    ToolTemplate:
      type: object
      required: [title, kind, spec]
      properties:
        title: { type: string }
        kind: { $ref: '#/components/schemas/ToolKind' }
        spec: { type: string }
    AffordInput:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1, description: В минимальной единице currency }
        currency: { $ref: '#/components/schemas/Currency' }
        date: { type: string, format: date, description: По умолчанию сегодня; не дальше 90 дней }
        title: { type: string, maxLength: 120 }
        recurring: { type: string, enum: [weekly, monthly], description: Повторяющийся платёж }
        lang: { $ref: '#/components/schemas/Locale' }
    AffordAlternative:
      type: object
      required: [kind, title, date, amount, verdict]
      properties:
        kind: { type: string, enum: [later_date, smaller_amount, split] }
        title: { type: string }
