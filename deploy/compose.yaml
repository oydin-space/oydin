# Прод Oydin: caddy (TLS) + postgres + api (gunicorn) + web (Next standalone).
# Образы собираются локально (linux/amd64) и загружаются по ssh: см. deploy/deploy.sh.
name: oydin
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?нужен .env}
      BUGSINK_HOST: ${BUGSINK_HOST:-bugsink.oydin.space}
      DOCS_HOST: ${DOCS_HOST:-docs.oydin.space}
      OLD_HOST: ${OLD_HOST:-oydin.sayfi.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./docs-site:/srv/docs-site:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      retries: 3
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: oydin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен .env}
      POSTGRES_DB: oydin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oydin -d oydin"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    image: oydin-api:latest
    environment:
      DATABASE_URL: postgres://oydin:${POSTGRES_PASSWORD}@db:5432/oydin
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?нужен .env}
      DEBUG: "0"
      ALLOWED_HOSTS: ${PUBLIC_HOST},api,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
      DEMO_LOGIN: ${DEMO_LOGIN:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-oydin_agent}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-3.1-flash-lite}
      LLM_CLASSIFY_MODEL: ${LLM_CLASSIFY_MODEL:-google/gemini-3.1-flash-lite}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-google/gemini-3.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-google/gemini-3.5-flash-lite}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Oydin <noreply@oydin.space>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EXA_API: ${EXA_API:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-False}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      # 1 = без Vault секреты не пишутся (нет отката на Fernet). Включать после инициализации Vault: deploy/vault/README.md.
      VAULT_REQUIRED: ${VAULT_REQUIRED:-0}
      # 0 = старые Fernet-значения больше не читаются (после vault_reencrypt с нулём остатка).
      VAULT_LEGACY_READ: ${VAULT_LEGACY_READ:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  # Доставка вебхуков публичного API; окружение и образ те же, что у api.
  webhooks:
    image: oydin-api:latest
    command: ["python", "manage.py", "deliver_webhooks", "--loop"]
    environment:
      DATABASE_URL: postgres://oydin:${POSTGRES_PASSWORD}@db:5432/oydin
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?нужен .env}
      DEBUG: "0"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
  # Рассылки бота: утренняя сводка, предупреждения о разрыве, недельный дайджест, напоминания.
  botjobs:
    image: oydin-api:latest
    command: ["python", "manage.py", "run_bot_jobs", "--loop"]
    environment:
      DATABASE_URL: postgres://oydin:${POSTGRES_PASSWORD}@db:5432/oydin
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?нужен .env}
      DEBUG: "0"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-oydin_agent}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
  web:
    image: oydin-web:latest
    environment:
      API_URL: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  # Самохостный трекер ошибок (Sentry-совместимый), SQLite в томе bugsink_data.
  # Первый DSN: войти на https://bugsink.oydin.space, создать проект, DSN в SENTRY_DSN (.env), затем docker compose up -d api.
  bugsink:
    image: bugsink/bugsink:2.6.3
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?нужен .env}
      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL:?нужен .env}:${BUGSINK_ADMIN_PASSWORD:?нужен .env}
      PORT: "8000"
      BASE_URL: https://${BUGSINK_HOST:-bugsink.oydin.space}
      BEHIND_HTTPS_PROXY: "true"
      SITE_TITLE: Oydin errors
    volumes:
      - bugsink_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  # Самохостный HashiCorp Vault: Transit-ключ oydin-creds шифрует пароли Didox и секреты коннекторов.
  # Сеть vault internal: порт наружу не публикуется, выхода в интернет нет. После каждого рестарта хранилище запечатано,
  # его распечатывает оператор (deploy/vault/README.md). Здоровье = процесс отвечает (запечатанный и неинициализированный тоже ок).
  vault:
    image: hashicorp/vault:2.1.2
    command: ["server"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/oydin-app.hcl:/vault/policies/oydin-app.hcl:ro
      - vault_data:/vault/file
      - vault_logs:/vault/logs
    networks:
      - vault
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200&standbyok=true"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  caddy_config:
  bugsink_data:
  vault_data:
  vault_logs:
networks:
  vault:
    internal: true
